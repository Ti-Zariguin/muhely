lkalmasság",["M.1: 1. rész legalább 1000 m, 2. rész legalább 700 m hosszú országos/helyi közút kivitelezési referencia (5 éven belül befejezett, részenként max 2 szerződés)","M.2: 1 fő MV-KÉ és 1 fő MV-M felelős műszaki vezető, mindkettő legalább 36 hó közútépítési tapasztalattal"]],["Teljesítés helye","Csongrád, Lőkösháza"],["Részek",["2 rész, 120 nap / 60 nap:","Lőkösházi belterületi utak burkolatfelújítása","Csongrád - KözPONT belterületi utak felújítása"]],["Támogatás","Európai Regionális Fejlesztési Alap (ERFA) (2021/2027)"],["Felhívások",["19661/2026 (2026. nov. 11.), Uniós, Ajánlati / részvételi felhívás"]],["Dokumentumok",["2_resz_Muszaki_dokumentacio.zip.002","2_resz_Muszaki_dokumentacio.zip.005","1_resz_Muszaki_dokumentacio","2_resz_Muszaki_dokumentacio.zip.001","2_resz_Muszaki_dokumentacio.zip.003","2_resz_Muszaki_dokumentacio.zip.004","2_resz_Muszaki_dokumentacio.zip.006","Közbeszerzési_Dokumentumok"]]],"analysis":["Alkalmasság, referencia (M/1): 5 éven belül lezárt (legfeljebb 8 éven belül kezdett) közútépítési referencia kell, 1. részhez legalább 1000 m, 2. részhez legalább 700 m, részenként legfeljebb 2 szerződéssel igazolva. Mindkét részre külön referencia kell, ha valaki mindkettőre ajánl. A 2. rész fajlagosan jóval drágább (térkő burkolat, szegélycsere), a nettó ajánlati ár plafonja 1. rész 66 335 241 Ft, 2. rész 364 041 439 Ft. (606-612., 262. és 484. sor)","Szakember: M.2.1 MV-KÉ és M.2.2 MV-M, mindkettő legalább 36 hónap közútépítési kivitelezési tapasztalattal; részeken belül átfedés nem megengedett, de ugyanaz a két személy megjelölhető mindkét részre. A többlettapasztalat külön értékelési szempont (0-24 hó), szakemberenként 5%. Az építőipari kivitelezői névjegyzékben (Méptv.) és a kamarai névjegyzékben a szerződéskötésig szerepelni kell, különben a szerződéskötéstől való visszalépésnek minősül. (676-691., 212-221. és 1340-1348. sor)","Pénzügyi feltétel: gazdasági-pénzügyi alkalmassági követelményt nem találtam a felhívásban, ajánlati biztosítékot sem írnak elő. (722. és 1033. sor)","Szerződéses kockázat: késedelmi kötbér 0,5%/nap, legfeljebb 20%; hibás teljesítési kötbér 0,1%, legfeljebb 20%; meghiúsulási kötbér 30%; teljesítési és jótállási biztosíték 5-5%; jótállás legalább 36 hónap, többlet jótállás szempont (0-24 hó, 10%). Szokatlan az eseti kötbér a környezetterhelési (CO2) megajánlásra: minden megkezdett 1% eltérésért a nettó díj 0,5%-a, legfeljebb 30%, vagyis a 10%-os CO2-szempontra tett megajánlást számon kérik. Tartalékkeret 5%. (860-868. sor)","Pénzügyi terhelés: szállítói vagy utófinanszírozás, 100%-os támogatás. Előleg a vállalkozói díj legfeljebb 30%-áig kérhető, de előleg-visszafizetési biztosíték kell hozzá (a szerződés elszámolható összegének 10%-a és az előleg különbözetére jutó támogatás). Részszámlázás biztosított. (825-836. és 869-871. sor)","Feltételesség: a szerződés hatálybalépésének felfüggesztő feltétele, hogy a TOP Plusz támogatási szerződésből a fedezet rendelkezésre álljon; ha az aláírástól számított 180 naptári napon belül nem lép hatályba, a szerződés visszamenőleg megszűnik. Ez a nyertesnek addig is kötöttséget (ajánlati kötöttség, munkaerő) jelent kifizetési garancia nélkül. (1278-1283. sor)","Ütemezés: ajánlattételi határidő 2026.12.10 13:00, felbontás 14:00. A teljesítési időtartam értékei (1. rész 60 nap, 2. rész 120 nap, a munkaterület-átadástól számított naptári nap) a zajos szövegből a részekhez rendelve olvashatók, a mezőcímke nem egyértelmű. TIPP: decemberi indulásnál az aszfaltozás időjárásfüggő, ami a 60 és 120 napos határidőt szűkítheti; ezt a felhívás nem tárgyalja. (1183., 1227., 231., 443., 257. és 479. sor)"],"summary":["Két település útfelújítása egy eljárásban, két külön részben. A megrendelő a Magyar Közút.","1. rész, Lőkösháza: hét utca aszfaltjának felújítása szakaszosan, összesen kb. 1700 m. Főleg új AC-11 kopóréteg (kb. 495 m³) és padka.","2. rész, Csongrád belvárosa: 1144 m utca felújítása marással és új aszfalttal (kb. 500 m³ kopó, 73 m³ kötő), kb. 1630 m² térkővel és kb. 3470 m szegéllyel.","A teljesítési idő 120, illetve 60 nap. A nettó ajánlati ár felső határa: 1. rész kb. 66 M Ft, 2. rész kb. 364 M Ft. Uniós (ERFA) forrásból."],"techStruct":[["1. rész: Lőkösháza",["7 belterületi utca: Alapítók útja, Kossuth, Árpád, Jókai, Nagykör, Arany János, Kiss Ernő utca","Szakaszos burkolatfelújítás, összesen kb. 1700 m","AC 11 kopóréteg 327,4 + 167,8 m³","Marás 30,5 m³","Padka 320 m³","Nettó árplafon 66 335 241 Ft"]],["2. rész: Csongrád belváros",["Belvárosi utak felújítása, 1144,35 m","Marás 458,68 m³","AC 11 kopó 499,84 m³","AC 22 kötő 72,65 m³","Térkő 831,35 m² (10 cm) + 228,3 m² + 571,8 m² (más vastagság)","Kiemelt szegély 1752,9 m, süllyesztett szegély 1717,1 m","Nettó árplafon 364 041 439 Ft"]],["Szerződés",["2 rész, 120, illetve 60 nap","Uniós forrás (ERFA)"]]],"techAnalysis":[],"read":true,"pts":[[49.49,48.68,1,"Csongrád"],[131.03,79.64,1,"Lőkösháza"]]},{"id":"EKR002484482025","url":"https://ekr.gov.hu/eljarastar/eljaras/EKR002484482025","tech":["Kivitelezésési dokumentáció.z02","Kivitelezésési dokumentáció","Kivitelezésési dokumentáció.z03","Kivitelezésési dokumentáció.z05","Kivitelezésési dokumentáció.z01","Kivitelezésési dokumentáció.z04"],"what":"Szegedi Rakpart komplex fejlesztése","who":"Szeged Megyei Jogú Város Önkormányzata","published":"2026. nov. 11.","publishedIso":"2026-11-11","countyCode":"HU333","county":"Csongrád-Csanád","inArea":true,"towns":["Szeged"],"type":"Rakpartépítés","group":"viz","subtypes":[["Tereprendezés","egyeb"],["Közműépítés","kozmu"],["Földmunka","egyeb"]],"flags":["Uniós","EU-forrás","Feltételes"],"deadline":[2026,12,10,10,0],"status":"E40 - Ajánlattételi szakasz","details":[["Eljárás","Nyílt eljárás, uniós eljárásrend, építési beruházás, Rakpart építése (45241100-9)"],["Szakasz","E40 - Ajánlattételi szakasz"],["Határidő","2026. dec. 10. 10:00"],["Műszaki tartalom","Szegedi Rakpart komplex fejlesztése (Huszár Mátyás rakpart, kb. 300 m, B és C szakasz): generálkivitelezés átalányáras szerződéssel. Zöldfelület, öntözés, közművek, térvilágítás, kamerák, mosdópavilon, látszóbeton, lépcsők; aszfaltos járda 1200 m2, beton járda 316 m2, úttest marás és aszfaltozás 1639 m2, lépcsőépítés 1203 m2; műemlék hídfő és Vizibástya felújítása."],["Értékelés",["Egyösszegű nettó ajánlati ár (tartalékkeret nélkül) 70%","M/2 a) szakember többlettapasztalat (0-24 hó) 6%","M/2 b) szakember többlettapasztalat (0-24 hó) 6%","M/2 c) szakember többlettapasztalat (0-24 hó) 6%","M/2 d) szakember többlettapasztalat (0-24 hó) 6%","Többletjótállás a 36 hónapon felül (0-24 hó) 6%"]],["Becsült érték","Nincs megadva a felhívásban"],["Alkalmasság",["M/1 (5 éven belül befejezett): legalább 150 m2 látszóbeton; legalább 1200 m2 zöldfelület; legalább 50 m2 műemlék építményen felületfelújítás/burkolás","M/2: MV-É-M, MV-KÉ, MV-K, MV-ÉV jogosultságú szakember (egy-egy fő)"]],["Teljesítés helye","Szeged"],["Részek","Nincs részekre bontva, 11 hónap"],["Támogatás","Európai Regionális Fejlesztési Alap (ERFA) (2021/2027)"],["Felhívások",["19572/2026 (2026. nov. 11.), Uniós, Ajánlati / részvételi felhívás"]],["Dokumentumok",["Kivitelezésési dokumentáció.z02","Kivitelezésési dokumentáció","Kivitelezésési dokumentáció.z03","Kivitelezésési dokumentáció.z05","Kivitelezésési dokumentáció.z01","Kivitelezésési dokumentáció.z04","Közbeszerzési dokumentáció","Szerződéstervezet","Közbeszerzési dokumentáció_mód_1"]]],"analysis":["Az alkalmasság szűk, műemléki-tájépítészeti profilú: M/1 szerint 5 éven belül lezárt referencia kell legalább 150 m2 látszóbetonra, 1200 m2 zöldfelületre és 50 m2 műemlék építményen végzett felújításra/burkolásra (alpontonként max. 6 referenciával, a műemlékesnél 1 munka). Egy tisztán közmű/út cég ezt önállóan nem tudja, kell mellé műemlékes és kertépítő partner. (597-616. sor)","Szakember (M/2): négy külön jogosultság kell, MV-É-M (műemléki), MV-KÉ (közlekedési, 3 év gyakorlat okl. építőmérnökkel vagy 5 év építőmérnökkel), MV-K (tájépítész) és MV-ÉV (villamos). Ha a szakember nem az ajánlattevő alkalmazottja (pl. megbízási szerződéssel dolgozik), alvállalkozónak minősül. (646-668. és 727-730. sor)","Pénzügyi alkalmassági feltételt (árbevétel, P/1) nem találtam a felhívásban, csak M/1 és M/2 szerepel. Becsült érték sincs megadva. (575-668. sor)","Szerződéses kockázat: átalányáras szerződés, késedelmi kötbér 0,5%/nap (max. 20%), meghiúsulási kötbér 25%, teljesítési és jótállási biztosíték egyaránt 5%, minimum 36 hónap jótállás, valamint min. 100 M Ft/esemény, 200 M Ft/év felelősségi limitű építés-szerelési biztosítás. Ajánlati biztosíték nincs. (317-321. és 764-770. sor)","Pénzügyi terhelés: utófinanszírozás (TOP Plusz, 100% támogatás), 5 részszámla (15-30-50-65-80% készültségnél) és 20% végszámla csak a végső átvétel után. Az 5% előleg kérhető, a munkaterület-átadástól számított 15 napon belül jár, a tartalékkeret 5%. (680-704. és 774. sor)","Feltételes eljárás (Kbt. 53. § (5)): a szerződéskötés feltétele a miniszteri vélemény a 2024. évi LXXIV. tv. 254. § (3) szerint, de ha a miniszter határidőn belül nem nyilatkozik, a szerződés megköthető. (783-786. sor)","Ütemezés: 11 hónap teljesítés a munkaterület-átadástól (az átvétel 30 napja ezen belül kezdődik), ajánlattételi határidő 2026.12.10 10:00, helyszíni bejárás nincs. Az értékelés 70% ár, 30% szakember-többlettapasztalat (4x6%) és többletjótállás (max. 24 hó, 6%), ami magas jótállási terhet hozhat. (302-310., 817-822. és 906. sor)"],"summary":["Szegeden a Huszár Mátyás rakpart kb. 300 m-es szakaszát (B és C szakasz) újítják meg teljes körűen. Egy generálkivitelező, átalányár, 11 hónap.","Készül új zöldfelület öntözéssel, közművek és egy kis szennyvízátemelő, térvilágítás, kamerák, mosdópavilon, látszóbeton falak és kb. 1200 m² lépcső.","Útból kb. 1640 m² marás és újraaszfaltozás, járdából kb. 1500 m². A kopóréteg háromféle színű aszfalt lesz. A műemlék hídfőt és a Vízibástyát is felújítják.","A munka a Tisza-parton folyik, a földmunka és a cölöpözés a vízállástól függ, ezért az ütemezés kockázatos. Uniós (ERFA) forrásból."],"techStruct":[["Hol és mekkora",["Szeged, Huszár Mátyás rakpart, kb. 300 m (B és C szakasz)","B szakasz útfelújítás 332,10 m, járda 296,55 m, lejáró sétány 97,46 m","C szakasz 237,51 m","Úttest 5,50 m széles, szűkületekben 5,00 m"]],["Rétegrend, teljes csere (felülről)",["5 cm AC11 kopó (3 színárnyalat)","7 cm AC22 kötő","7 cm AC22 alap","15 cm beton alapréteg","15 cm homokos kavics ágyazat","200 g/m² geotextília"]],["Rétegrend, megmaradó burkolaton",["4 cm átlagos marás","7 cm kötő","5 cm kopó"]],["Munkarészek",["Zöldfelület és öntözés","Közművek, szennyvízátemelő (D90 PE nyomóvezeték)","Térvilágítás, kamerák","Mosdópavilon","Látszóbeton, lépcsők, rámpa, tereplépcsők","Acél csőcölöpök az alsó rakparton","Műemlék hídfő és Vízibástya felújítása"]],["Főbb mennyiségek",["Úttest marás és aszfaltozás 1639 m²","Aszfaltos járda 1200 m², beton járda 316 m²","Lépcsőépítés 1203 m²"]],["Szerződés",["Generálkivitelezés, átalányár, 11 hónap","Uniós forrás (ERFA)"]]],"techAnalysis":["Út és járda: a B szakasz útfelújítása 332,10 m, az átépülő járda 296,55 m, a gyalogos lejáró sétány 97,46 m; a C szakasz 0+000 és 0+237,51 szelvény között 237,51 m. A burkolat szélessége 5,50 m, szűkületekben 5,00 m, 30 km/h sebességkorlát, forgalomlassító szintemelések 10-15 cm. (Útépítési leírás B, 122-136. sor; Útépítési leírás C, 118-127. sor)","Pályaszerkezet: teljes cserénél 5 cm AC11 kopó, 7 cm AC22 kötő, 7 cm AC22 alap, 15 cm beton alapréteg, 15 cm homokos kavics ágyazat, 200 g/m2 geotextília; a megmaradó burkolaton 4 cm átlagos lemarás, 7 cm kötő, 5 cm kopó. Szokatlan: a kopóréteg 3 színárnyalatú (A1 világos, A2 vöröses, A3 bazalt), laboratóriumi mintadarabok és kőváz-egyeztetés alapján, a beépítéshez minden rétegre technológiai utasítás és próbaépítés kell. (Útépítési leírás B, 178-185., 212-230. és 254-262. sor)","Szennyvíz (B szakasz): kútsüllyesztéses, víz alatti kotrással épülő WUM előregyártott átemelő (1,60 m belméret, 2 szivattyú), felúszás ellen 2,32 x 2,32 m, 50 cm mély betongallérral; nyomóvezeték D90 PE100 SDR17, vízvételi helyeknél D110 PE100 SDR17 csatlakozó csatorna, ivókúthoz D32 PE100. A Szegedi Vízmű Zrt. az ártérben tervezett csatornát és átemelőt nem veszi át üzemeltetésre, vagyis az átadás-átvétel és az üzemeltető kérdése nyitott. (Közmű leírás B, 240-258., 298-312. sor)","Partfal-keresztezés: a nyomóvezetéket a meglévő, két végén lezárt D400 résfali átvezetésen át, DN150 KO védőcsővel, átfúrással kell átvezetni, a védőcsövet a falátvezetéshez hegesztett kötéssel kell csatlakoztatni, a védőcső és a haszoncső közét vízzáró anyaggal kell kitölteni. Ez árvízvédelmi műtárgy mellett végzett pontszerű munka, a fúrás módját és a keresztezések számát a leírásban nem találtam megadva. (Közmű leírás B, 254-258. sor)","Közmű- és földmunka-kockázat: a meglévő gázvezetéktől 1 m-en belül csak kézi földmunka végezhető, a töltéstől 100 m-en belül talajbolygatás csak az ATIVIZIG szakfelügyeletével; a C szakaszon a vízvezeték és csatorna 2 m-es sávjában csak óvatos kézi földmunka. Visszatöltés 95% tömörségi fokig, burkolat alatt teljes bányahomok talajcsere. A munkaárok víztelenítésével a tervező nem számol (alacsony Tisza-vízállást feltételez), a talajvíz viszont közvetlenül a Tisza vízállásától függ. (Közmű leírás B, 177., 280-296. sor; Közmű leírás C, 137., 221. sor; Földmunka leírás, 193-196. sor)","Földmű és szerkezet: a töltéstest három zónájára külön tömörségi előírás van (Trρ legalább 87%, a drénpaplanra 92%, a feltöltésre 90%), a tetején 55 cm termőtalaj. A rakparton rámpa és 4 tereplépcső épül a rézsűre; az alsó rakparton a járólapokat 2,5 m hosszú, CHS 273 x 5,0 mm acél csőcölöpök hordják, nyitott véggel levert/levibrált kivitelben, a cölöptengely tűrése a fejnél +-2 cm, ezért vezetőkeret kell. Vízállásfüggő, nehezen ütemezhető munkarész. (Földmunka leírás, 329., 436., 470. sor; Tartószerkezeti leírás B, 129-132., 296-310. sor)","Szervezés és szerződéses kockázat: ideiglenes forgalomszabályozási tervet a vállalkozónak kell készítenie és a közútkezelővel jóváhagyatnia, tartós félpályás korlátozásnál jelzőlámpával; az úszóművek gyalogos megközelíthetősége végig biztosítandó; heti bontású ütemterv és organizációs terv kell. Előre nem látható fémszennyeződés vagy régészeti lelet esetén a határidő nem tartható, ilyenkor a megrendelő szerződésmódosítást ír elő, de a felhívásban jelzett feltételesség miatt ez a kitétel külön ellenőrzést érdemel. (Megrendelői követelmények, 44., 54-61., 90-95., 102. sor)","Eltérés és hiány: a felhívás 1639 m2 úttest marását és aszfaltozását jelöli; a leírásokban a hosszak (332,10 m és 237,51 m) és a 5,00-5,50 m szélesség ennél nagyobb összfelületet sejtet, TIPP, mert a leírásban nincs összesített m2, a költségvetésből ellenőrizendő. Nem olvastam: az árazatlan költségvetést (xlsx), az erős- és gyengeáramú, építész és tájépítész terveket, a 375 rajz-PDF-et; a 425 fájlból 9 leírást dolgoztam fel. A C szakasz útleírása a B szakasz fúrásait (F-20, F-23) idézi, nem biztos, hogy a C szakaszra külön feltárás készült. (felhívás 187-188. sor; Útépítési leírás C, 195-201. sor)"],"read":true,"pts":[[49.1,99.0,1,"Szeged"]]},{"id":"EKR002141312026","url":"https://ekr.gov.hu/eljarastar/eljaras/EKR002141312026","tech":["04 Tr épület út és járda.zip","05 FMIKK épület 04 kV szabadt elo.zip","06 MVM Démász 22 kV csatl.zip","01 Tr épület építészet, statika.zip","03 Tr épület gépészet szellőzés mód_11_03.zip","Árazatlan költségvetés Főösszesítő.zip"],"what":"SZTE FMIKK transzformátor állomás kivitelezése","who":"Szegedi Tudományegyetem","published":"2026. nov. 16.","publishedIso":"2026-11-16","countyCode":"HU333","county":"Csongrád-Csanád","inArea":true,"towns":["Szeged"],"type":"Közműépítés","group":"kozmu","subtypes":[],"flags":[],"deadline":[2026,12,4,10,0],"status":"E40 - Ajánlattételi szakasz","details":[["Eljárás","Kbt. 112. § (1) bekezdés b) pont Nyílt eljárás (hirdetménnyel induló), nemzeti eljárásrend, építési beruházás, Áramátalakító alál zettséget és gyakorlatot. A 15%-os többlettapasztalat-szempont 0-36 hónap, és a szakember nevét az ajánlatban kötelező megadni, hiánya érvénytelenséget okoz. (474-480., 242-244. és 514-516. sor)","Pénzügyi feltétel: árbevételi küszöböt nem találtam, csak a P1 sorbaállás-nyilatkozatot (24 hónap, 15 nap). Ajánlati biztosíték viszont van, 400 000 Ft. Becsült érték nincs megadva, az árszint a közbeszerzési dokumentációból (költségvetés) ítélhető meg, az nem része a felhívásnak. (517-520. és 481-482. sor)","Szerződéses kockázat: késedelmi kötbér naptári naponként 1%, legfeljebb 15% (15 késedelmes nap alatt eléri a plafont), meghiúsulási kötbér 20%, jótállás legalább 60 hónap plusz a vállalt többlet (max. 24 hó, 15% pont), jótállási biztosíték 5%, építés-szerelési felelősségbiztosítás legalább 15 000 000 Ft/káresemény és 30 000 000 Ft/év, a munkaterület-átadásig. Tartalékkeret nincs. (653-661., 673-677. és 645. sor)","Pénzügyi terhelés: 100%-os TOP Plusz támogatás, de utófinanszírozás. 5% előleg kérhető, öt számla 15-40-60-80-100% készültségnél, a végszámla csak az átadás-átvétel és a műszaki ellenőri igazolás után. Alvállalkozó közvetlen kifizetése a Kbt. 135. § (3) szerint. (567-573. és 641-645. sor)","Feltételes eljárás (Kbt. 53. § (5)): a szerződés megkötése a miniszter költségellenőrzési véleményéhez kötött, amelyet a legkedvezőbb ajánlatra 45 napon belül ad meg, és ha nem nyilatkozik, a szerződés megköthető. Az ajánlatkérő szerint az eljárás megindításához szükséges előzetes vélemény megvan (KAT/7993/2026/KÖMO). Az ajánlati kötöttség 60 nap, így a 45 napos vélemény belefér. (254-267. és 615. sor)","Ütemezés: ajánlattételi határidő 2026.11.23 12:00, felbontás 13:00, a felhívás feladása 2026.11.03, vagyis 20 nap az ajánlatra. A kivitelezési határidő a munkaterület-átadástól számít, a 7 hónapos időtartam értéke a zajos szövegből nem biztosan rendelhető a mezőhöz. Szokatlan előírás: a bontott betonburkolatot darálás, osztályozás és minősítés után a tervezett pályaszerkezetbe vissza kell építeni, hulladék nem keletkezhet. (630-632., 758., 250., 353. és 228-231. sor)"],"summary":["Tótkomlóson a Fő út mellett új kerékpárút épül a Zrínyi és a Luther utca között. Ez 499 m, hozzá jön a Szondy utcai ág 33 m-e, összesen 532 m. Határidő 7 hónap.","Szakaszonként közös gyalog- és kerékpárút vagy önálló kétirányú kerékpárút lesz (2,3-3,1 m széles), aszfaltburkolattal.","Különlegesség: a meglévő 1,7 m széles betonjárdát fel kell bontani, ledarálni, és az anyagát vissza kell építeni az új pálya alá.","Kell még sárga villogó, a Luther utcában 355 m kerékpáros nyom felfestése és kevés térkőmunka. Uniós (TOP Plusz) forrásból."],"techStruct":[["Hol és mekkora",["Tótkomlós, Fő út mellett, Zrínyi u. és Luther u. között 498,88 m","Szondy utcai ág 33,28 m","Összesen 532,16 m"]],["Keresztmetszet",["Kétirányú kerékpárút 2,30 m","Közös gyalog- és kerékpárút 2,75-3,10 m","Padka 0,5 m"]],["Rétegrend, kerékpárút (felülről)",["3 cm AC 8 kopó","4 cm AC 11 kötő","5 cm M22","20 cm M90","20 cm homokos kavics fagyvédő","120 g/m² geotextília"]],["Munkarészek",["A meglévő 1,7 m széles beton teljes bontása, darálás, minősítés, visszaépítés a pályába","Földvári utcai térkő bontása, részleges visszaépítése","Sárga villogó (alvállalkozó)","Luther utcában 355 m kerékpáros nyom felfestése","Csapadékvíz: 20 m padkafolyóka, víznyelő, 9 m KG PVC cső","8 m új korlát"]],["Főbb mennyiségek",["Bevágás 652,9 m³, töltés 22,4 m³ (keresztszelvényekből)"]],["Szerződés",["Nincs részekre bontva, 7 hónap","Uniós forrás (TOP Plusz)"]]],"techAnalysis":["Fő mennyiségek: a Fő úti nyomvonal 0+000 és 0+498,88 között 55 keresztszelvénnyel, hozzá a Szondy utcai ág 33,28 m (a felhívás 532,16 fm-ével egyezik, a leírás összhosszt nem mond). Burkolat: kétirányú kerékpárút 2,30 m, egyesített gyalog- és kerékpárút 2,75-3,10 m, padka 0,5-0,5 m. Földmunka a keresztszelvények feliratainak összege: bevágás 652,9 m3, töltés 22,4 m3. (Műszaki leírás, 247-251. sor; 3 HSZ, 101. és 155. sor; 4 JKSZ, 76-2763. sor)","Pályaszerkezet kerékpárúton: 3 cm AC 8 kopó, 4 cm AC 11 kötő, 5 cm M22, 20 cm M90, 20 cm homokos kavics fagyvédő, 120 g/m2 geotextília (összesen 52 cm). A Földvári utcai szélesítésnél 5 cm AC 11 kopó, a felújított részen 5 cm AC 11 kopó 0-5 cm 0/32 zúzottkő ágyazáson a meglévő burkolaton. (Műszaki leírás, 255-260., 262-273. és 275-278. sor)","Szokatlan munkarész: a meglévő 1,7 m széles betonburkolatot teljes hosszában és szélességében el kell bontani, a bontott anyagot darálás, osztályozás és minősítés után vissza kell építeni a pályaszerkezetbe, hulladék nem keletkezhet. A bontandó szakasz hossza és a visszaépíthető hányad nincs megadva, a minősítés eredménye árkockázat. Térkő: a Földvári utcai iskola előtt 3,3 m széles, 0+445,22-0+459,52 közötti sáv bontása, 0,5-0,5 m visszaépítéssel (a térkő cseréjét a rajz önkormányzati önerős beruházásnak jelöli). (Műszaki leírás, 202-204. és 213-217. sor; 2-1 HSZR, 394-396. sor)","Geometria és tervezői kompromisszumok: több R=3 m sugarú ív, 90 fokos kis ívek és beláthatatlan ház sarok (Fő út 24.); két közműoszlop az űrszelvényben (0+017 és 0+225), kiváltásuk nincs a projekt költségvetésében, így a kivitelezőnek kockázat, ha a kezelő mégis kiváltást kér. Az Árpád-Béla király utca közötti kerékpártárolókat és korlátokat el kell távolítani, 8,0 m új korlát kell. (3 HSZ, 73-100. sor; Műszaki leírás, 119-131. és 196-198. sor; 2-3 HSZR, 146-148. sor)","Csapadékvíz és önerős tételek: 20,0 m padkafolyóka, 32x32 cm víznyelő, NA 200 KG PVC cső 9,0 m a Földvári utcai árokba; a szomszédos tetőlefolyó átkötése NA 110 KG PVC, 4,7 m, a projektben nem elszámolható, az önkormányzat önerőből fizeti. Az árok keresztezésénél az Alföldvíz 50 cm alatti csőtető-árokfenék távolságnál kiváltást vagy csőátereszt ír elő. (Műszaki leírás, 399-404. sor; 2-1 HSZR, 383. és 388. sor; Alföldvíz ARV1, 41-46. sor)","Közmű- és kezelői határidők, költségek: Alföldvíz szakfelügyelet 8 nappal előre, díja árjegyzék szerint; gáz bejelentés 3 munkanappal előre, gépi földmunka tilos a vezetéktől 1-1 m-en belül, geodéta-kitűzés kell; 2Connect szakfelügyelet 15 nappal előre, 2-2 m-en belül csak kézi munka, védelembe helyezés a beruházás terhére; MVM Démász kutatóárok és hasított védőcső, feszültségmentesítés igénye 30 nappal előre; Magyar Közút munkavégzési engedély 5 nappal előre, szakfelügyelet 11 000 Ft/óra + ÁFA + 100 Ft/km, a munkakezdés feltétele. (_mennyisegek.md 2. rész; ARV1, 37-39. sor; GAZ, 29-30., 46-47. sor; 2Connect nyilatkozat, 38-53. sor; e-közmű, 412-433. sor; Közút, 24-47. és 68. sor)","Forgalom és érvényességek: a 4427 számú úton 17+612 km-nél kerékpáros átvezetés tartós kivitelű burkolati jellel és a 2-3 rajz szerinti forgalomtechnikával; ideiglenes forgalomkorlátozás csak a külön UT920-1/2023 forgalomkorlátozási terv és közútkezelői hozzájárulás alapján (a terv nincs a csomagban), gyalogos híd-provizórium és buszmegálló-biztosítás a kivitelező dolga. A közútkezelői hozzájárulás érvényessége 2027. március 13-ig hosszabbítva; az Alföldvíz és a gáz nyilatkozat 1 évig érvényes (2026.03.19, illetve 2026.03.09 kelettel). A sárga villogót alvállalkozó építi, itt nem elemeztem. (Közút KKH, 21-24. sor; Közút, 51-65., 85-101. sor; ARV1, 154-157. sor; GAZ, 129. sor)","Hiányzik vagy ellentmondó: a költségvetés és a szakaszonkénti burkolat-, bontás-, szegély- és kapubejáró-mennyiség nincs a csomagban, a szövegrétegből nem olvasható ki; a talajmechanikai szakvélemény (Tm 22-2560) csak hivatkozás; a MÁV és a VOLÁNBUSZ hozzájárulás szkennelt PDF (15 bájt szöveg), nem olvasható, miközben a leírás szerint vasúti érintettség nincs; a közműrajz Telekom légkábelt jelöl, a nyilatkozat szerint a Telekom nem érintett. A rajzok 2023-as tervszámot (UT920-1/2023) viselnek, a közműnyilatkozatok 2026 márciusiak. (Műszaki leírás, 109. és 407. sor; 2-2 HSZR, 1165. sor; e-közmű, 350. sor)"],"read":true,"pts":[[93.62,81.65,1,"Tótkomlós"]]},{"id":"EKR002278652026","url":"https://ekr.gov.hu/eljarastar/eljaras/EKR002278652026","tech":["műs  Egyösszegű (átalánydíjas) szerződés, teljesítési idő 10 hónap. Lebonyolító: CORDICT Kft."],["Részvételi szakasz",["Kétszakaszos eljárás (Kbt. 117. §, a meghívásos eljárás szabályai szerint): a részvételi jelentkezés határideje 2026.10.29. 11:00 volt, az ajánlattételi határidő (EKR) 2026.12.01. 11:00.","A részvételi jelentkezések elbírálásáról szóló összegezés (2026.11.16.): 7 jelentkezés, mind alkalmas és érvényes, mind a 7 ajánlattételre felhívva.","Felhívottak: STRABAG Építő Kft., DÉLÚT Kft. (Algyő), Colas Út Zrt., Duna Aszfalt Zrt. (Tiszakécske), ÚT-ÉP-KER 97 Kft., MEGA-SPED Kft. (Kecskemét), Soltút Kft. (Solt).","Ajánlatot csak a felhívott jelentkezők tehetnek: aki most csatlakozna, annak ebben az eljárásban már nincs helye."]],["Értékelés",["Egyösszegű nettó ajánlati ár 70% (fordított arányosítás)","Többletjótállás 0-24 hó 15% (24 hó felett is 24 hóként számít; a 36 hó kötelező minimumon felül kell megajánlani)","M.2.1 szakember többlet szakmai tapasztalata 0-36 hó 10%","M.2.2 szakember többlet szakmai tapasztalata 0-36 hó 5%","A nem ár szempontoknál egyenes arányosítás, pontszám 0-10"]],["Becsült érték","Nincs megadva a felhívásban"],["Ajánlati biztosíték","3 000 000 Ft"],["Alkalmasság",["SZ.1: szerepel a vállalkozó kivitelezők névjegyzékében (Méptv. 208. §)","P/1: az utolsó 3 lezárt üzleti évből legfeljebb 1 évben lehet negatív az adózott eredmény","P/2: az utolsó 3 lezárt üzleti év mélyépítési munkákból származó nettó árbevétele összesen legalább 300 000 000 Ft","M/1: az utolsó 5 évben (60 hónap) teljesített, legalább 600 m közút fejlesztési munka (építés és/vagy rekonstrukció) referencia","M/2.1: 1 fő MV-KÉ vagy MV-KÉ-R (vagy egyenértékű) felelős műszaki vezető, vagy a megszerzéséhez szükséges végzettség és gyakorlat","M/2.2: 1 fő MV-M felelős műszaki vezető (vagy egyenértékű), vagy a megszerzéséhez szükséges végzettség és gyakorlat"]],["Teljesítés helye","Kiskunfélegyháza"],["Részek","Nincs részekre bontva, 10 hónap"],["Támogatás","Nincs uniós forrás megjelölve az EKR-ben"],["Felhívások",["17981/2026 (2026. okt. 19.), Nemzeti, Eljárást megindító felhívás"]],["Dokumentumok",["Árazatlan költségvetés","Részvételi dokumentáció","Tervdokumentáció 3","Tervdokumentáció 4","Ajánlati dokumentáció","Tervdokumentáció 2","Tervdokumentáció 1","Szerződéstervezet","Kiegészítő tájékoztatás","Kiegészítő tájékoztatás","Kiegészítő tájékoztatás","Kiegészítő tájékoztatás","Kiegészítő tájékoztatás","Összegezés a részvételi jelentkezések elbírálásáról"]]],"analysis":["Alkalmassági küszöb a tárgyhoz mérve: M/1 legalább 600 m közút fejlesztési referencia 5 éven belül, a kb. 950 m-es tárgy mintegy 63%-a, ami közepes útépítőnek teljesíthető. Az ajánlatkérő 5 évben befejezett, de legfeljebb 8 éven belül megkezdett beruházást fogad el, részteljesítés is megfelel. A felhívás tartalmaz minősítési (bronz/ezüst) utalásokat is, ezek a szigorúbb elemeket sorolják fel, az M/1 az ezüst IA/IB kategóriánál mennyiségében szigorúbb. (609-611., 854-861. sor)","Pénzügyi küszöb: ez a legerősebb szűrő. P/2 szerint a 3 lezárt üzleti év mélyépítési nettó árbevétele összesen legalább 300 millió Ft, ami komoly forgalmat kíván (a becsült érték nem szerepel a felhívásban, az arány nem ítélhető meg), és csak mélyépítési munka számít. P/1: legfeljebb egy negatív adózott eredmény a 3 évből. A P/1 egyenként, a P/2 közös ajánlattevőknél együttesen is teljesíthető. Árbevétel-nyilatkozat esetén a nettó árbevételre vonatkozó nyilatkozat kell. (529-538. és 562-568. sor)","Szakember: két fő kell, M.2.1 MV-KÉ vagy MV-KÉ-R, M.2.2 MV-M, jogosultság vagy a megszerzéséhez szükséges végzettség és gyakorlat. Minimum gyakorlati hónapot a felhívásban nem találtam. A többlet szakmai tapasztalat mindkét szakembernél 0-36 hónap, összesen 15% súly (10% és 5%), 36 hó felett egységesen maximum pont. Az M/2 igazolását az ajánlatban kell benyújtani (Kbt. 69. § (7)), a többi igazolás csak felhívásra. A szempontszámozás a szövegben következetlen (M.2.2 is 2. sorszámmal szerepel). (583-584., 645-653. és 186-194., 233-237., 287-290. sor)","Szerződéses kockázat: késedelmi kötbér 0,5%/naptári nap, plafon 15% (30 késedelmes naptári nap alatt eléri), meghiúsulási kötbér 25% (a nettó ajánlati árra számolva). Teljesítési biztosíték 5% és jóteljesítési biztosíték 5% (részletes szabály a szerződéstervezetben, azt a felhívás nem tartalmazza). Jótállás minimum 36 hónap, plusz legfeljebb 24 hónap vállalható (összesen 60 hó). Kötelező all risk építési-szerelési (CAR) biztosítás a teljes időtartamra, legalább 200 millió Ft/év és 100 millió Ft/kár értékhatárral, harmadik személyi kárra is. Az ajánlatkérő kiköti, hogy nem köteles az aránytalanul alacsony ár vizsgálatára (795. sor), ez agresszív árazásnak is teret ad. (774-781., 786-787. és 795-797., 874-878. sor)","Finanszírozás és számlázás: átalánydíjas szerződés, előleg a szerződéses összeg 5%-a (Kbt. 135. § (7)), összesen 5 számla a végszámlával együtt, a végszámla feltétele a sikeres műszaki átadás-átvétel lezárása. Teljesítésigazolás Kbt. 135. és Ptk. 6:130. szerint, a 322/2015. Kr. 32/A. alkalmazandó. Konkrét fizetési határidőt a felhívásban nem találtam (a szerződéstervezetben lehet). Az 5%-os előleg mellett a teljesítési és jóteljesítési biztosíték (5-5%) és a 3 M Ft ajánlati biztosíték miatt a működőtőke-igény számottevő. Uniós forrást nem találtam megnevezve. (691-699. és 701-707. sor)","Határidők és eljárásrend: kétszakaszos eljárás. A felhívásban szereplő 2026.10.29. 11:00 a részvételi jelentkezés határideje volt (a felhívás 2026.10.15-i, 829-838. sor). A 2026.11.16-i összegezés szerint 7 jelentkező mind alkalmas és érvényes, mind a hetet ajánlattételre hívták (összegezés V.2.3); az EKR szerinti ajánlattételi határidő 2026.12.01. 11:00. Ajánlatot tehát csak ez a hét cég adhat, köztük négy nagy (Strabag, Colas, Duna Aszfalt, Délút), ami erős árversenyt jelez az 1 negatív évre és 300 M Ft mélyépítési árbevételre szűrt mezőnyben. Ajánlati kötöttség 60 nap, teljesítési idő 10 hónap, közös jelentkezésnél egyetemleges felelősségvállalás kell. (819-823., 798-799., 864-873. sor; részvételi összegezés 133-172. sor)","Szokatlan vagy figyelendő: a felhívás nem határozza meg a becsült értéket és a pályaszélességet, a költségvetés (nem a felhívás része) nélkül az ár nem ítélhető meg. A 15% többletjótállás és 15% szakember-többlettapasztalat összesen 30% nem ár súly, 0-24 és 0-36 hó plafonnal, ezért az ár 70%-os fordított arányosítása a döntő, de a plafonos megajánlások gyakorlatilag mindenkinek megérik. Tiltott a változat (nem megengedett). A nyertes ajánlattevő a 322/2015. Kr. 26. § szerint köteles a CAR biztosításra. (181-183., 240., 242. és 287-292., 874-878. sor)"],"summary":["Kiskunfélegyházán a Molnártelepi utat szélesítik és megerősítik kb. 950 m hosszon. Átalányár, 10 hónap.","Teljesen új, vastag pálya készül: 4 cm és 10 cm aszfalt, alatta 20 cm cementstabilizáció és 20 cm zúzottkő. Az aszfaltfelület a költségvetés szerint kb. 6830 m².","A munkához tartozik a régi burkolat bontása és elszállítása, a szegélyek, a kapubejárók, a közműaknák szintbe hozása és egy betonkő elválasztó sziget. A költségvetésben külön rész egy tömör betonkerítés.","Kétszakaszos eljárás: ajánlatot csak az a 7 cég tehet, amelyik a részvételi szakaszban jelentkezett (köztük a STRABAG, a Colas és a Duna Aszfalt)."],"techStruct":[["Hol és mekkora",["Kiskunfélegyháza, Molnártelepi út, kb. 950 m","Szélesítés és burkolatmegerősítés"]],["Rétegrend (felülről)",["4 cm AC11 kopó (mF)","10 cm AC22 kötő (mF)","20 cm Ckt-4 alapréteg","20 cm M63 zúzottkő védőréteg","Tömörített altalaj"]],["Munkarészek",["Régi burkolat bontása és elszállítása","Kiemelt és süllyesztett szegély","Kapubejárók helyreállítása, szintbe hozása","Betonkő elválasztó sziget","Közműaknák szintbe helyezése","Tömör betonkerítés (külön költségvetés)","Kerítés menti füvesítés"]],["Főbb mennyiségek (árazatlan költségvetés)",["58 tétel: útépítés 40, kerítés 18","Aszfaltrétegek felülete 6828,3 m²","Elszállítás 4568 m³","Kerítés: 240 oszlop bontása, 237 új"]],["Szerződés",["Átalányár, 10 hónap","Kétszakaszos eljárás: csak a 7 részvételi jelentkező tehet ajánlatot"]]],"techAnalysis":[],"read":true,"pts":[[26.51,48.49,1,"Kiskunfélegyháza"]]},{"id":"EKR002107662026","url":"https://ekr.gov.hu/eljarastar/eljaras/EKR002107662026","tech":["Engedély","Tervdokumentáció"],"what":"Szilárd burkolatú helyi közút építése","who":"Pirtó Község Önkormányzata","published":"2026. okt. 27.","publishedIso":"2026-10-27","countyCode":"HU331","county":"Bács-Kiskun","inArea":true,"towns":["Pirtó"],"type":"Útépítés","group":"ut","subtypes":[],"flags":["EU-forrás","2× módosítva","KiegTáj: 2","Feltételes"],"deadline":[2026,11,18,14,0],"status":"E40 - Ajánlattételi szakasz","details":[["Eljárás","Kbt. 112. § (1) bekezdés b) pont Nyílt eljárás (hirdetménnyel induló), nemzeti eljárásrend, építési beruházás, Közút építése (45233120-6)"],["Szakasz","E40 - Ajánlattételi szakasz"],["Határidő","2026. nov. 18. 14:00"],["Műszaki tartalom","Pirtó, 029 hrsz: szilárd burkolatú helyi közút építése 0+000-0+805,89 km, hossz 805,89 m, felület 3555 m2, szélesség 4,00/5,50/6,00 m. Úttükör 3955 m2, 30 cm stabilizációs alapréteg 1187 m3, 2 réteg (8 cm + 5 cm) aszfalt 467 m3."],["Értékelés",["Ajánlati ár (nettó Ft, tartalékkerettel) 70% (7 pont a 10-ből)","M.1 szakember többlet szakmai gyakorlati ideje (0-12 hó) 15% (1,5 pont)","Jótállás (36-60 hó) 10% (1 pont)","12-es vagy korszerűbb környezetvédelmi osztályú tehergépkocsik 5% (0,5 pont)"]],["Becsült érték","Nincs megadva a felhívásban"],["Alkalmasság",["M.2: legalább 603 m hosszú út építés/bővítés/felújítás referencia (60 hónapon belül teljesített, max 3 szerződés)","M.1: 1 fő MV-KÉ felelős műszaki vezető"]],["Módosítás oka","Az ajánlattételi határidő meghosszabbítása (Kbt. 52. § (4) b): benyújtás 2026-11-13 14:00 -> 2026-11-18 14:00; bontás 2026-11-13 15:00 -> 2026-11-18 15:00."],["Teljesítés helye","Pirtó"],["Részek","Nincs részekre bontva, 4 hónap"],["Támogatás","Európai Mezőgazdasági Vidékfejlesztési Alap
