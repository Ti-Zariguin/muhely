<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}.mbar{--mb-bg:#22262B;--mb-fg:#F2F3F1;--mb-acc:#E8692C;position:relative;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--mb-bg);color:var(--mb-fg);font:600 13px/1.2 "Segoe UI",system-ui,sans-serif;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.mbar a{color:var(--mb-fg);text-decoration:none}.mbar a:hover{color:var(--mb-acc)}.mbar a:focus-visible{outline:2px solid var(--mb-acc);outline-offset:2px}.mbar span{opacity:.65;font-weight:400}</style></head><body><nav class="mbar"><a href="../">&larr; Vissza a műhelybe</a><span>Zariguin műhelye</span></nav>
<title>Saját párt</title>

<meta name="description" content="Eszmetörténeti döntéses játék Andrew Heywood Political Ideologies című könyve alapján: pártot alapítasz, hét tanácsadó vitázik, a végén csillagtérkép mutatja, hová került a pártod.">

<style>
/* Layout: a night sky, like the Tudástár star maps. Sticky top band with the party badge and seven advisor meters,
   one card per screen in a single column, the main action in a bar at the bottom. Deliberately a single dark theme. */
:root {
  --bg: #070b1a; --paper: #10173a; --sheet: #0c1230; --fg: #e9ecf8; --muted: #9aa3c7; --rule: #26305e;
  --accent: #ffd27a; --star: #cfe0ff; --line: #3a4a8c; --chip: #1b2452; --bad: #ff8a7a; --good: #8fe0b0;
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #070b1a; --paper: #10173a; --fg: #e9ecf8; } }
:root[data-theme="dark"] { --bg: #070b1a; --paper: #10173a; --fg: #e9ecf8; }

html, body { overflow-x: clip; }
body { background-color: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  background-image:
    radial-gradient(1.2px 1.2px at 23px 41px, #ffffffb0, transparent), radial-gradient(1px 1px at 141px 97px, #ffffff80, transparent),
    radial-gradient(1.4px 1.4px at 211px 173px, #cfe0ffc0, transparent), radial-gradient(1px 1px at 77px 211px, #ffffff70, transparent),
    radial-gradient(1px 1px at 183px 23px, #ffffff90, transparent), radial-gradient(0.8px 0.8px at 109px 149px, #ffffff60, transparent),
    radial-gradient(120% 70% at 50% 0%, #121a44 0%, transparent 65%);
  background-size: 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 100% 100%;
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(100px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
h1 { font-weight: 800; font-size: clamp(1.7rem, 6.5vw, 2.4rem); line-height: 1.05; letter-spacing: -0.02em; }
h2 { font-weight: 800; font-size: 1.25rem; line-height: 1.15; }
h3 { font-weight: 700; font-size: 1rem; }
.kicker { font-family: var(--font-display); font-weight: 700; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.fine { font-size: 0.86rem; color: var(--muted); }

/* Top band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(12, 18, 48, 0.94); border: 1px solid var(--rule); border-top: 0;
  border-radius: 0 0 10px 10px; padding: 8px 12px 10px; display: grid; gap: 8px; backdrop-filter: blur(6px); }
.top .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
.badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge svg { width: 22px; height: 22px; flex: none; }
.prog { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.meters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.m { display: grid; gap: 3px; justify-items: center; min-width: 0; font-family: var(--font-display); font-size: 0.68rem; color: var(--muted); }
.m .n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m .bar { position: relative; width: 100%; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.m .bar i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 3px; transition: width 0.5s ease; }
.m.ally .n { color: var(--accent); }
.m.ally .n::before { content: "★ "; }
.m.gone { opacity: 0.4; } .m.gone .n { text-decoration: line-through; }
.m.edge .bar i { background: var(--bad); }

/* Cards */
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 18px 22px; display: grid; gap: 14px; min-width: 0;
  box-shadow: 0 0 40px rgba(120, 150, 255, 0.08); }
.lede { color: var(--muted); font-size: 1.02rem; }
.theme { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.sit { font-size: 1.04rem; }
.ask { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; border-top: 1px dashed var(--rule); padding-top: 12px; }

/* Advisors */
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-weight: 800; font-size: 0.9rem;
  color: #070b1a; background: var(--c); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); }
.voices { display: grid; gap: 12px; }
.voice { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
.voice .who { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font-family: var(--font-display); }
.voice .who b { font-weight: 700; }
.voice .who .id { font-size: 0.78rem; color: var(--c); }
.voice .who .to { font-size: 0.78rem; color: var(--muted); }
.voice p { margin-top: 2px; border-left: 2px solid color-mix(in srgb, var(--c) 55%, transparent); padding-left: 10px; }
.empty { font-size: 0.88rem; color: var(--muted); font-style: italic; }
.team { display: grid; gap: 12px; }
.member { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; border-top: 1px solid var(--rule); padding-top: 12px; }
.member:first-child { border-top: 0; padding-top: 0; }
.member .who { font-family: var(--font-display); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.member .who .id { font-size: 0.8rem; color: var(--c); }
.member .role { font-size: 0.86rem; color: var(--muted); }
.member q, .quote { display: block; font-style: italic; margin-top: 6px; }
q::before { content: "„"; } q::after { content: "”"; }

/* Options */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2em 1fr; gap: 10px; align-items: start; text-align: left; background: var(--sheet); border: 1px solid var(--line);
  border-radius: 8px; padding: 13px 14px 13px 10px; cursor: pointer; min-height: 56px; transition: border-color 0.15s, background 0.15s; }
.opt:hover { border-color: var(--accent); background: #141d4a; }
.opt:active { transform: translateY(1px); }
.opt .key { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 1.05rem; text-align: center; padding-top: 1px; }
.opt .s { font-family: var(--font-display); font-weight: 700; display: block; }
.opt .t { display: block; font-size: 0.95rem; color: var(--muted); margin-top: 2px; }
.opt .by { display: inline-block; margin-top: 6px; font-family: var(--font-display); font-size: 0.74rem; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); border-radius: 999px; padding: 0 8px; }

/* Result */
.progline { border-left: 3px solid var(--accent); padding-left: 12px; display: grid; gap: 4px; }
.progline .lab { font-family: var(--font-display); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.reacts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.re { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: baseline; font-family: var(--font-display); font-size: 0.88rem; min-width: 0; }
.re .nm { color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.re .st { grid-column: 1 / -1; font-size: 0.74rem; color: var(--muted); margin-top: -4px; }
.d { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.d.up { color: var(--good); } .d.down { color: var(--bad); } .d.zero { color: var(--muted); }
.ev { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; background: var(--sheet); }
.ev.leave { border-color: color-mix(in srgb, var(--bad) 60%, transparent); }
.ev.leave h3 { color: var(--bad); }
.ev.ally { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.ev.ally h3 { color: var(--accent); }

/* Founding */
.field { display: grid; gap: 8px; }
.field label, .field .lab { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; }
.txt { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--font-display); font-size: 1.05rem; width: 100%; box-sizing: border-box; }
.swatches, .syms { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent; background: var(--c); cursor: pointer; box-shadow: inset 0 0 0 3px var(--paper); }
.sw[aria-pressed="true"] { border-color: var(--fg); }
.sy { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; display: grid; place-items: center; color: var(--pc); }
.sy svg { width: 28px; height: 28px; }
.sy[aria-pressed="true"] { border-color: var(--pc); box-shadow: 0 0 12px color-mix(in srgb, var(--pc) 40%, transparent); }
.preview { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px dashed var(--rule); border-radius: 10px; }
.preview svg { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 0 8px var(--pc)); }
.card.note { border-style: dashed; margin-top: 14px; }
.preview b { font-family: var(--font-display); font-size: 1.2rem; }
.cities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.city { text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; display: grid; gap: 4px; color: var(--fg); font: inherit; }
.city b { font-family: var(--font-display); font-size: 1.02rem; }
.city .sc { font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.city .t { font-size: 0.88rem; color: var(--muted); }
.city[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 35%, transparent); }
@media (max-width: 440px) { .cities { grid-template-columns: 1fr; } }

/* Ending */
.plist { margin: 0; padding-left: 1.6em; display: grid; gap: 8px; }
.plist li::marker { font-family: var(--font-mono); color: var(--accent); }
.plist .tt { font-family: var(--font-display); font-weight: 700; font-size: 0.86rem; color: var(--muted); display: block; }
.groups { display: grid; gap: 14px; }
.groups h3 { font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.sky { border: 1px solid var(--rule); border-radius: 10px; background: radial-gradient(70% 60% at 50% 50%, #131c4a 0%, #080c20 100%); overflow: hidden; }
.sky svg { display: block; width: 100%; height: auto; }
.sky .bg circle { fill: #fff; }
@media (prefers-reduced-motion: no-preference) { .sky .tw { animation: tw 4s ease-in-out infinite alternate; } .sky .me { animation: pulse 2.6s ease-in-out infinite alternate; } }
@keyframes tw { from { opacity: 0.25; } to { opacity: 0.9; } }
@keyframes pulse { from { opacity: 0.35; } to { opacity: 0.8; } }
.sky .axis { stroke: #2a3670; stroke-width: 1; stroke-dasharray: 3 6; }
.sky .axl { fill: var(--muted); font-family: var(--font-mono); font-size: 16px; }
.sky .lbl { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 21px; paint-order: stroke; stroke: #070b1a; stroke-width: 4px; stroke-linejoin: round; }
.sky .faint .lbl { fill: var(--muted); font-weight: 500; font-size: 18px; }
.sky .link { stroke-width: 1.6; opacity: 0.85; }
.sky a:focus-visible .core { stroke: #fff; stroke-width: 2; }
.near { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.near li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; }
.near .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); transform: translateY(1px); }
.axes { display: grid; gap: 12px; }
.ax { display: grid; gap: 4px; }
.ax .nm { font-family: var(--font-display); font-weight: 700; font-size: 0.88rem; }
.ax .track { position: relative; height: 14px; }
.ax .track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--rule); border-radius: 1px; }
.ax .track::after { content: ""; position: absolute; left: 50%; top: 2px; width: 1px; height: 10px; background: var(--line); }
.ax .pt { position: absolute; top: 1px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--c); }
.ax .pt.me { box-shadow: 0 0 10px var(--c); z-index: 1; }
.ax .pt.id { width: 8px; height: 8px; margin-left: -4px; top: 3px; background: transparent; border: 2px solid var(--c); }
.ax .ends { display: flex; justify-content: space-between; gap: 10px; font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); }
.ax .ends span:last-child { text-align: right; }
.faintcard { border-left: 3px solid #6f6a66; padding-left: 12px; display: grid; gap: 6px; }
.reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-family: var(--font-display); font-size: 0.85rem; }
.lnk { background: none; border: 0; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--muted); }
.lnk.danger { color: var(--bad); }

/* Bottom action bar */
.act { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(12, 18, 48, 0.96); border-top: 1px solid var(--rule);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.act .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.act .hint { font-family: var(--font-display); font-size: 0.9rem; color: var(--muted); flex: 1; }
.prim { flex: 1; min-height: 52px; background: var(--accent); color: #070b1a; border: 0; border-radius: 8px; font-family: var(--font-display); font-weight: 800;
  font-size: 1.05rem; cursor: pointer; padding: 10px 16px; }
.prim:active { transform: translateY(1px); }

@media (max-width: 440px) {
  .card { padding: 16px 14px 18px; }
  .meters { gap: 4px; }
  .m { font-size: 0.6rem; }
  .reacts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .m .bar i { transition: none; } }
</style>

<script>
// Saját párt: pure game logic and content (no DOM).
// Ideology content follows the lebontás notes on Heywood, Political Ideologies (3rd ed.), chapters 1-10
// (store/konyvtar/heywood-politikai-ideologiak/lebontas-01..10). The two cities are real; the advisors and every situation are invented.
// The numeric positions of the ideologies on the seven axes are a game-design reading of those notes, not Heywood's numbers.
var SIM = (function () {
  "use strict";

  // Axes: 1-2 (merged), 3, 4, 5, 7 of lebontas-01 section 12(b); axis 6 ("új politika") is split into two (F, Z),
  // because feminism and ecologism would otherwise share a single direction.
  var AX = [
    { k: "B", name: "Egyenlőség és gazdaság", lo: "egyenlőség, közösségi gazdaság", hi: "piac, a különbségek elfogadása" },
    { k: "T", name: "Tekintély", lo: "részvételi, „lágy”", hi: "tekintélyelvű, „kemény”" },
    { k: "V", name: "Változás", lo: "megőrzés", hi: "gyökeres változás" },
    { k: "A", name: "Az állam szerepe", lo: "kevés vagy semmi állam", hi: "erős, kiterjedt állam" },
    { k: "N", name: "Nemzeti és globális", lo: "határtalan világ", hi: "nemzeti önrendelkezés" },
    { k: "F", name: "Nemek", lo: "hagyományos szerepek, magánügy", hi: "a személyes politikai" },
    { k: "Z", name: "Természet", lo: "ember és növekedés előbb", hi: "a természet előbb" }
  ];
  var DIMS = AX.map(function (a) { return a.k; });

  var TT = "https://ti-zariguin.github.io/muhely/tudastar/ideologiak/";

  // Ideology stars. pos: seven-axis position (-1..1). The map shows B (x) and T (y), after Eysenck's two-dimensional
  // spectrum (lebontas-01, 12(c)). faint: shown on the final map only, no advisor.
  var IDEO = [
    { k: "lib", name: "Liberalizmus", color: "#ffd27a", link: TT, pos: { B: 0.3, T: -0.45, V: 0.2, A: -0.2, N: -0.4, F: 0.2, Z: -0.1 } },
    { k: "kon", name: "Konzervativizmus", color: "#8fa8ff", link: TT, pos: { B: 0.4, T: 0.45, V: -0.75, A: 0.2, N: 0.5, F: -0.6, Z: 0.1 } },
    { k: "szoc", name: "Szocializmus", color: "#ff7a6b", link: TT, pos: { B: -0.7, T: -0.05, V: 0.4, A: 0.7, N: -0.3, F: 0.3, Z: -0.3 } },
    { k: "nac", name: "Nacionalizmus", color: "#e8b070", link: TT, pos: { B: 0.15, T: 0.4, V: -0.2, A: 0.4, N: 0.9, F: -0.45, Z: 0 } },
    { k: "ana", name: "Anarchizmus", color: "#d5dbea", link: TT + "anarchizmus/", pos: { B: -0.55, T: -0.9, V: 0.8, A: -1, N: -0.8, F: 0.3, Z: 0.3 } },
    { k: "fem", name: "Feminizmus", color: "#d6a8ff", link: TT + "feminizmus/", pos: { B: -0.45, T: -0.3, V: 0.6, A: 0.3, N: -0.4, F: 1, Z: 0.2 } },
    { k: "oko", name: "Ökologizmus", color: "#7ee0a0", link: TT + "okologizmus/", pos: { B: -0.15, T: -0.55, V: 0.7, A: 0, N: -0.2, F: 0.2, Z: 1 } },
    { k: "fas", name: "Fasizmus", color: "#9c8f88", faint: true, link: TT + "fasizmus/", pos: { B: 0.75, T: 0.95, V: 0.7, A: 1, N: 1, F: -0.9, Z: -0.2 } },
    { k: "fund", name: "Vallási fundamentalizmus", color: "#a49d86", faint: true, link: TT, pos: { B: 0.35, T: 0.8, V: 0.4, A: 0.5, N: 0.2, F: -0.7, Z: 0 } }
  ];
  var IDX = {}; IDEO.forEach(function (d) { IDX[d.k] = d; });

  // Why the two faint stars have no advisor (lebontas-02 12(a) Democracy; lebontas-07 3-4; lebontas-10 2, 4, 12).
  var FAINT = [
    { k: "fas", title: "Fasizmus: miért nincs a tanácsadók között?",

    { id: "idosek", title: "Ki gondozza az időseket?", theme: "jólét, adó, nemek",
      text: { hmv: "Vásárhelyen egyre több az idős ember, és a tanyákon sokan egyedül élnek, messze a legközelebbi szomszédtól. Az idősotthonba évekig kell várni. A házi gondozást ma főleg a lányok és a menyek végzik, munka mellett, fizetség nélkül. A városnak döntenie kell, honnan legyen pénz, és ki végezze a munkát.",
        sz: "Szegeden egyre több az idős ember: a fiatalok a diploma után gyakran elköltöznek, a nagyszülők maradnak. Az idősotthonba évekig kell várni. A házi gondozást ma főleg a lányok és a menyek végzik, munka mellett, fizetség nélkül. A városnak döntenie kell, honnan legyen pénz, és ki végezze a munkát." },

        { a: "lib", t: "Az adóemeléssel óvatos vagyok. Adjunk gondozási utalványt a családoknak, és válasszák ki ők, melyik szolgáltatót kérik. A választás joga az övék, nem a hivatalé." },
        { a: "kon", t: "Az idős ember nem ügyfél. Régen a család, a szomszéd és az egyházközség vigyázott rájuk. Ezt kell megerősíteni, nem kiváltani egy hivatallal." },
        { a: "fem", to: "kon", t: "Gáspár bácsi, a „család” ebben a mondatban azt jelenti: a lányok. Senki nem fizeti őket, és közben elveszítik a saját állásukat. Ha a családra bízzuk, legyen fizetett munka, és vegyék ki a részüket a fiúk is." }
      ],
      q: "Melyik megoldás kerül a programba?",
      opts: [
        { s: "Progresszív adó, városi otthon", t: "Aki többet keres, többet fizet, és a város saját idősotthont épít fizetett ápolókkal.", by: "szoc", v: { B: -0.8, A: 0.8 }, prog: "Progresszív helyi adóból városi idősotthon, fizetett ápolókkal." },

        { s: "Család és gyülekezet", t: "A város kisebb összeggel támogatja a családokat és a gyülekezeti segítőköröket, új intézmény nélkül.", by: "kon", v: { B: 0.3, A: -0.2, V: -0.7, F: -0.6 }, prog: "Az idősgondozás a családok és a gyülekezeti segítőkörök dolga marad, kis városi támogatással." },
        { s: "Fizetett otthoni ápolás", t: "Fizetés és nyugdíjjog az otthon ápolóknak, gondozási szabadság a férfiaknak is.", by: "fem", v: { F: 1, B: -0.5, A: 0.4, V: 0.4 }, prog: "Aki otthon ápol, fizetést és nyugdíjjogot kap, a gondozási szabadság a férfiaknak is jár." }
      ] },
    { id: "kamerak", title: { hmv: "Kamerák a Kossuth téren", sz: "Kamerák a belvárosban" }, theme: "szabadság és rend",
      text: { hmv: "Egy hónapja kiraboltak egy patikát a Kossuth tér közelében, azóta este kevesebben járnak ki. A testületben felmerült, hogy arcfelismerő kamerák kerüljenek a Kossuth térre és a buszállomásra, és legyen több esti járőr. Az ára a városi kassza tizedrésze.",
        sz: "Egy hónapja kiraboltak egy patikát a belvárosban, a Dóm tér közelében, azóta este kevesebben járnak ki. A testületben felmerült, hogy arcfelismerő kamerák kerüljenek a belvárosi terekre, a hidakra és a pályaudvarra, és legyen több esti járőr. Az ára a városi kassza tizedrésze." },
      voices: [
        { a: "kon", t: "Az emberben ott a rossz, bennem is, benned is. Csak a következetesen betartatott törvény tartja vissza. Kell a kamera, és kell a rendőr. Rend nélkül szabadság sincs." },
        { a: "lib", to: "kon", t: "Gáspár, minden kormány lehetséges zsarnok, a jó szándékú is. Egy arcfelismerő kamera nemcsak a tolvajt látja, hanem azt is, ki megy be a szakszervezetbe vagy az orvoshoz. Ha kamera, akkor bírói engedéllyel, és harminc nap után töröljék a felvételt." },
        { a: "ana", t: "Kamera nélkül is tudjuk, ki lakik a környéken. Szervezzünk esti szomszédsági sétákat, és nyissuk ki újra az ifjúsági klubot. A biztonság nem a rendőrtől jön, hanem attól, hogy ismerjük egymást." },
        { a: "fem", t: { hmv: "Kérdezzétek meg a nőket, miért nem járnak ki este. Nem a patika miatt, hanem a sötét buszmegálló és a kivilágítatlan aluljáró miatt. Kezdjük a lámpákkal.",
          sz: "Kérdezzétek meg a nőket, miért nem járnak ki este. Nem a patika miatt, hanem a sötét villamosmegálló és a kivilágítatlan aluljáró miatt. Kezdjük a lámpákkal." } }

        { s: "Szomszédság és ifjúsági klub", t: "Kamerák helyett esti szomszédsági séták és nyitott ifjúsági klub, a lakók szervezésében.", by: "ana", v: { T: -0.9, A: -0.8, V: 0.5 }, prog: "Kamerák helyett szomszédsági esti séták és nyitott ifjúsági klub." },
        { s: "Világítás, éjszakai járat", t: "A kamerapénzből kivilágított megállók és aluljárók, éjszakai járat, a nők javaslatai alapján.", by: "fem", v: { F: 0.9, T: -0.3, A: 0.3 }, prog: "A kamerapénzből kivilágított megállók és éjszakai járat, a nők javaslatai alapján." }

    { id: "szobor", title: "Lovas szobor", theme: "nemzet, hagyomány, emlékezet",
      text: { hmv: "A nemzeti ünnepre a város lovas szobrot állítana a Kossuth térre, egy szabadságharcban elesett vásárhelyi huszártisztnek. A szoborra gyűjtés is indult. Közben egy hódtói játszótéren két éve nincs hinta, mert nem jut rá pénz.",

        { a: "fem", t: { hmv: "Nézzétek meg, kiket szoktunk szoborra tenni: szinte mindig férfiakat, gyakran lovon. Ha már szobor, legyen a tanyák és a piac asszonyaié, akik ezt a várost etették.",

          prog: { hmv: "Az új szobor a tanyák és a piac vásárhelyi asszonyainak állít emléket.", sz: "Az új szobor a szegedi kofáknak, munkásnőknek és ápolónőknek állít emléket." } },

    { id: "ber", title: "Egyenlő bér a városi cégeknél", theme: "nemek, munka, család",
      text: { hmv: "Kiszivárgott két városi tulajdonú cég bérlistája. Ugyanabban a munkakörben a nők átlagosan tizenöt százalékkal kevesebbet keresnek. A cégvezetők szerint ez nem szándékos: a férfiak többet túlóráznak, a nők gyakrabban mennek el korábban a gyerekért.",
        sz: "Kiszivárgott négy városi tulajdonú cég bérlistája. Ugyanabban a munkakörben a nők átlagosan tizenöt százalékkal kevesebbet keresnek. A cégvezetők szerint ez nem szándékos: a férfiak többet túlóráznak, a nők gyakrabban mennek el korábban a gyerekért." },
      voices: [
        { a: "fem", t: "„Nem szándékos.” Persze. A nő azért megy el a gyerekért, mert valakinek el kell mennie, és ezt soha senki nem kérdezte meg a férfiaktól. Ez nem magánügy. A személyes politikai." },
        { a: "lib", t: "Ugyanazért a munkáért ugyanaz a bér, ez nem vita tárgya. Legyen nyilvános a bértábla, és akit hátrány ér, perelhessen. A törvény előtt nincs nő és férfi." },
        { a: "szoc", to: "lib", t: "Ádám, a bértábla nem viszi el a gyereket a bölcsődébe. Legyen ingyenes városi bölcsőde és apaszabadság, ami elvész, ha az apa nem veszi ki. Akkor a túlórát is meg lehet osztani." },
        { a: "kon", t: "Vannak, akik dolgozni járnak, és vannak, akik otthon nevelik a gyereket. Nem minden család akarja ugyanazt. Ne a hivatal döntse el, ki menjen a gyerekért." }
      ],
      q: "Melyik javaslat mellé áll a párt?",
      opts: [
        { s: "Nyilvános bértábla", t: "A városi cégek bértáblája nyilvános, a nemen alapuló bérkülönbség perelhető.", by: "lib", v: { F: 0.6, A: -0.1, B: 0.3 }, prog: "Nyilvános bértábla a városi cégeknél, a bérdiszkrimináció perelhető." },
        { s: "Bölcsőde és apaszabadság", t: "Ingyenes városi bölcsőde, és apaszabadság, ami elvész, ha nem veszik ki.", by: "szoc", v: { F: 0.7, B: -0.7, A: 0.7 }, prog: "Ingyenes városi bölcsőde és apaszabadság, amely elvész, ha nem veszik ki." },
        { s: "Kvóta és a láthatatlan munka", t: "A vezetés fele nő, és a város méri a fizetetlen otthoni munkát is.", by: "fem", v: { F: 1, V: 0.7, A: 0.3 }, prog: "Nemi kvóta a városi cégek vezetésében, a fizetetlen otthoni munka is bekerül a városi statisztikába." },
        { s: "A családokra bízzuk", t: "A bér a cégek dolga, az otthon maradó szülő pótlékot kap.", by: "kon", v: { F: -0.7, V: -0.6, B: 0.4 }, prog: "A bér a cégek dolga, az otthon maradó szülő városi pótlékot kap." }
      ] },
    { id: "gunydal", title: "Gúnydal a városnapon", theme: "szólásszabadság",
      text: { hmv: "A városnapon, a Kossuth téri színpadon egy helyi zenekar gúnydalt énekelt a városvezetésről, a templomról és a hősi emlékműről. A felvétel bejárta a várost. Sokan nevettek, sokan sértőnek tartják, és többen azt követelik, hogy a zenekart tiltsák ki a jövő évi rendezvényekről.",
        sz: "A városnapon, a Tisza-parti színpadon egy diákzenekar gúnydalt énekelt a városvezetésről, a templomról és a hősi emlékműről. A felvétel bejárta a várost. Sokan nevettek, sokan sértőnek tartják, és többen azt követelik, hogy a zenekart tiltsák ki a jövő évi rendezvényekről." },
      voices: [
        { a: "lib", t: "Én is utálhatom a dalukat, de a jogukat, hogy elénekeljék, megvédem. A rossz gondolatot vitában kell legyőzni, nem hallgatással. A tiltás egy olyan út első lépése, amelyről nehéz visszafordulni." },
        { a: "kon", t: "Szabadság van, persze. De a városi ünnep nem kocsma. A közös ünnep a közös tiszteleten áll, és aki ezt gúnyolja, a saját közösségét gúnyolja. A városi színpadra legyen szabály." },
        { a: "nac", to: "lib", t: "Ádám, a hősi emlékmű nem a városvezetésé. Azoké, akiknek a neve rajta van. Gúnyolják a hatalmat, rendben, de a halottakat hagyják békén." },
        { a: "ana", t: "Egy jó gúnydal a legjobb dolog, ami egy hatalommal történhet. Ha a hatalom kitilthatja azt, aki kineveti, akkor legközelebb nem nevetni fogunk, hanem suttogni." }
      ],
      q: "Mi a párt álláspontja?",

    if (!gone.length) h += '<p class="fine">Senki nem lépett ki. Mind a heten ott ülnek a választás estéjén.</p>';
    h += "</div></article>";

    h += '<article class="card"><h2>A pártod csillaga</h2><p>A térkép két tengelye Heywood bevezető fejezetéből jön, Eysenck kétdimenziós spektruma nyomán: vízszintesen az egyenlőség és a gazdaság, függőlegesen a tekintély. A pártod csillagát a döntéseid helyezik el. A vonalak a három legközelebbi eszme felé mutatnak.</p>' +
      '<div class="sky">' + starMap(pos, near) + '</div><p class="fine">A csillagokra kattintva a Tudástár oldalai nyílnak meg. A halvány csillagok mögött nincs tanácsadó, lásd lent.</p><h3>Legközelebb</h3><ul class="near">';
    near.slice(0, 3).forEach(function (nn) {
      var d = SIM.IDX[nn.k];
      h += '<li style="--c:' + d.color + '"><span class="dot"></span><span><b>' + esc(d.name) + "</b>, " + closeness(nn.d) + ' · <a href="' + d.link + '" target="_blank" rel="noopener">Tudástár</a></span></li>';
    });
    h += '</ul><p class="fine">A távolságot hét tengelyen méri a játék, a térkép ebből kettőt mutat. Ezért egy csillag lehet közelebb is, mint amilyennek a két tengelyes képen látszik. Az alábbi sávokon mind a hét látszik: a nagy pont a pártod, a karika a legközelebbi eszme.</p><div class="axes">';
    var top = SIM.IDX[near[0].k];
    SIM.AX.forEach(function (ax) {
      var pv = (pos[ax.k] + 1) * 50, iv = (top.pos[ax.k] + 1) * 50;
      h += '<div class="ax"><span class="nm">' + esc(ax.name) + '</span><div class="track"><span class="pt id" style="--c:' + top.color + ";left:" + iv.toFixed(1) + '%"></span><span class="pt me" style="--c:' + c + ";left:" + pv.toFixed(1) + '%"></span></div><div class="ends"><span>' +
        esc(ax.lo) + "</span><span>" + esc(ax.hi) + "</span></div></div>";
    });
    h += '</div><p class="fine">Heywood maga figyelmeztet: minden ilyen spektrum leegyszerűsít, legfeljebb gyorsírás. Egy párt akkor is egy eszmecsaládhoz tartozhat, ha egy-egy elemét elhagyja. A térkép tehát tükör, nem ítélet. Az eszmék helye a tengelyeken a játék saját olvasata Heywood leírásaiból, nem a könyv számai.</p></article>';

    h += '<article class="card"><h2>A két halvány csillag</h2>';
    SIM.FAINT.forEach(function (f) {
      var d = SIM.IDX[f.k];
      h += '<div class="faintcard"><h3>' + esc(f.title) + "</h3>";
      f.t.forEach(function (t) { h += "<p>" + esc(t) + "</p>"; });
      h += '<p class="fine"><a href="' + d.link + '" target="_blank" rel="noopener">Tovább a Tudástárba</a></p></div>';
    });
    h += '</article><article class="card"><h2>Tovább olvasva</h2><p><a href="' + SIM.TT + '" target="_blank" rel="noopener">Politikai ideológiák a Tudástárban</a>, és külön oldalon az <a href="' + SIM.TT + 'anarchizmus/" target="_blank" rel="noopener">anarchizmus</a>, a <a href="' + SIM.TT +
      'fasizmus/" target="_blank" rel="noopener">fasizmus</a>, a <a href="' + SIM.TT + 'feminizmus/" target="_blank" rel="noopener">feminizmus</a> és az <a href="' + SIM.TT + 'okologizmus/" target="_blank" rel="noopener">ökologizmus</a>.</p>' +
      '<p class="fine">Forrás: Andrew Heywood, Political Ideologies: An Introduction, 3. kiadás, 1-10. fejezet, magyar feldolgozásban. A két város valódi, a tanácsadók és a helyzetek kitaláltak.</p></article>';
    return h;
  }

  function resetRow() {
    return '<div class="reset">' + (confirmReset
      ? '<span>Az eddigi döntések törlődnek.</span><button class="lnk danger" type="button" id="reset-yes" data-act="reset-yes">Igen, új párt</button><button class="lnk" type="button" id="reset-no" data-act="reset-no">Mégsem</button>'
      : '<button class="lnk" type="button" id="reset-ask" data-act="reset-ask">Új párt alapítása</button>') + "</div>";
  }

  function renderAct() {
    var h = '<div class="in">';
    if (S.phase === "intro") h += '<button class="prim" type="button" id="act-start" data-act="tofound">Pártot alapítok</button>';
    else if (S.phase === "found") h += '<button class="prim" type="button" id="act-found" data-act="found">Megalapítom</button>';
    else if (S.phase === "meet") h += '<button class="prim" type="button" id="act-begin" data-act="begin">Jöjjön az első kérdés</button>';
    else if (S.phase === "q") h += '<span class="hint">Válassz egy javaslatot (A-' + LET[SIT[S.i].opts.length - 1] + ").</span>";
    else if (S.phase === "res") h += '<button class="prim" type="button" id="act-next" data-act="next">' + (S.i + 1 < SIT.length ? "Tovább: " + esc(sit(S.i + 1).title) : "A program és a csillagtérkép") + "</button>";
    else h += confirmReset
      ? '<button class="prim" type="button" id="act-reset-yes" data-act="reset-yes">Igen, új párt</button><button class="lnk" type="button" id="act-reset-no" data-act="reset-no">Mégsem</button>'
      : '<button class="prim" type="button" id="act-reset" data-act="reset-ask">Új párt alapítása</button>';
    $("act").innerHTML = h + "</div>";
  }

  function render(top) {
    renderTop();
    var v = { intro: viewIntro, found: viewFound, meet: viewMeet, q: viewQ, res: viewRes, end: viewEnd }[S.phase];
    $("view").innerHTML = v();
    renderAct();
    if (top) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  function readName() {
    var inp = S.phase === "found" ? $("pname") : null;
    if (inp && typeof inp.value === "string") SIM.setParty(S, inp.value);
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!b) return;
    var a = b.dataset.act, top = true;
    readName();
    if (a === "tofound") SIM.toFound(S);
    else if (a === "color") { SIM.setParty(S, null, +b.dataset.k, null); top = false; }
    else if (a === "city") { SIM.setCity(S, b.dataset.k); top = false; }
    else if (a === "sym") { SIM.setParty(S, null, null, +b.dataset.k); top = false; }
    else if (a === "found") SIM.found(S);
    else if (a === "begin") SIM.begin(S);
    else if (a === "pick") SIM.choose(S, +b.dataset.k);
    else if (a === "next") SIM.next(S);
    else if (a === "reset-ask") { confirmReset = true; top = false; }
    else if (a === "reset-no") { confirmReset = false; top = false; }
    else if (a === "reset-yes") { confirmReset = false; S = SIM.start(); }
    else return;
    if (a !== "reset-ask" && a !== "reset-no") confirmReset = false;
    save(); render(top);
  });
  // Keep the typed party name across reloads; the preview updates on the next render.
  document.addEventListener("input", function (ev) {
    if (S.phase === "found" && ev.target && ev.target.id === "pname") { SIM.setParty(S, ev.target.value); save(); }
  });

  function start(data) {
    S = data && valid(data.S) ? data.S : (load() || SIM.start());
    render(false);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { S: S }; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>

</body></html>
