<title>Mozgástér</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Döntéses történelmi játék: egy névtelen tanácsadó javaslatai a magyar pártvezetésnek, 1963-1989, és amit a vezetés valójában lépett.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap">
<style>
/* Layout: an archive file on a grey desk. Sticky file tab with four gauges on top, one typed sheet per case in a single column,
   the main action in a bar at the bottom. Typed (monospace) text = the game's file; printed serif card = what really happened. */
:root {
  --desk: #b4b3a8; --folder: #d8ceb3; --folder-edge: #b6aa8b; --paper: #f4f0e3; --card: #fbf9f2;
  --ink: #25262a; --muted: #625d51; --rule: #cdc3aa; --stamp: #a2322a; --violet: #4a428c; --ok: #3b6a48; --shade: rgba(40, 36, 28, 0.16);
  --font-type: "Courier Prime", "Courier New", Courier, monospace;
  --font-print: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-stamp: "Special Elite", "Courier Prime", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #1c1d1b; --folder: #3a362d; --folder-edge: #575040; --paper: #2a2823; --card: #322f29;
  --ink: #ebe5d5; --muted: #b3ab94; --rule: #4d4739; --stamp: #e46a5c; --violet: #aaa2f2; --ok: #8fc79d; --shade: rgba(0, 0, 0, 0.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #1c1d1b; --folder: #3a362d; --folder-edge: #575040; --paper: #2a2823; --card: #322f29;
  --ink: #ebe5d5; --muted: #b3ab94; --rule: #4d4739; --stamp: #e46a5c; --violet: #aaa2f2; --ok: #8fc79d; --shade: rgba(0, 0, 0, 0.35); color-scheme: dark; }

html, body { overflow-x: clip; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-print); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--folder); }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
p { margin: 0; }
a { color: var(--violet); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

/* File tab with gauges */
.tab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--folder); border: 1px solid var(--folder-edge); border-top: 0;
  border-radius: 0 0 6px 6px; padding: 8px 12px 10px; display: grid; gap: 8px; box-shadow: 0 3px 10px var(--shade); }
.tab .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; }
.brand { font-family: var(--font-stamp); font-size: 1.25rem; letter-spacing: 0.08em; }
.case { font-family: var(--font-type); font-size: 0.85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.g { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; font-family: var(--font-type); font-size: 0.8rem; min-width: 0; }
.g .l { text-transform: uppercase; letter-spacing: 0.06em; }
.g .v { font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: right; }
.g .dv { font-weight: 700; }
.g .dv.up { color: var(--ok); } .g .dv.down { color: var(--stamp); }
.bar { position: relative; height: 9px; border: 1px solid var(--ink); background: var(--paper); min-width: 40px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width 0.5s ease; }
.bar.warn i { background: var(--stamp); }
.bar::before, .bar::after { content: ""; position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.bar::before { left: 25%; } .bar::after { left: 75%; }

/* Sheet */
.sheet { position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; box-shadow: 0 1px 0 var(--folder-edge), 0 8px 18px var(--shade);
  padding: 20px 18px 22px; display: grid; gap: 14px; min-width: 0; }
.head { font-family: var(--font-type); font-size: 0.85rem; color: var(--muted); border-bottom: 1px dashed var(--rule); padding-bottom: 8px; display: grid; gap: 2px; padding-right: 92px; }
.head b { color: var(--ink); font-weight: 700; }
.corner { position: absolute; top: 14px; right: 12px; font-family: var(--font-stamp); font-size: 0.75rem; color: var(--stamp); border: 2px solid var(--stamp);
  padding: 2px 6px; transform: rotate(4deg); letter-spacing: 0.08em; opacity: 0.85; }
.year { font-family: var(--font-type); font-weight: 700; font-size: 2.1rem; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-type); font-weight: 700; font-size: 1.35rem; line-height: 1.25; }
h2 { font-family: var(--font-type); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.06em; }
.typed { font-family: var(--font-type); font-size: 1rem; line-height: 1.6; display: grid; gap: 10px; }
.ask { font-family: var(--font-type); font-weight: 700; font-size: 1.05rem; border-top: 1px dashed var(--rule); padding-top: 12px; }

/* Proposals */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: start; text-align: left; background: var(--card); border: 2px solid var(--ink);
  border-radius: 3px; padding: 14px 14px 14px 10px; cursor: pointer; min-height: 56px; box-shadow: 3px 3px 0 var(--folder-edge); }
.opt:hover { background: var(--folder); }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--folder-edge); }
.opt .key { font-family: var(--font-type); font-weight: 700; font-size: 1.2rem; text-align: center; }
.opt .s { font-family: var(--font-type); font-weight: 700; display: block; }
.opt .t { display: block; font-size: 0.95rem; color: var(--muted); margin-top: 2px; }

/* Outcome */
.mine { font-family: var(--font-type); border-left: 3px solid var(--ink); padding-left: 10px; display: grid; gap: 4px; }
.mine .lab { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-type); font-size: 0.85rem; }
.chip { border: 1px solid var(--rule); padding: 1px 7px; border-radius: 2px; font-variant-numeric: tabular-nums; }
.chip.up { color: var(--ok); border-color: currentColor; } .chip.down { color: var(--stamp); border-color: currentColor; }
.press { font-family: var(--font-type); font-size: 0.88rem; color: var(--muted); font-style: italic; }
.stamp { justify-self: start; font-family: var(--font-stamp); font-size: 1.5rem; letter-spacing: 0.12em; padding: 4px 14px; border: 3px solid currentColor;
  border-radius: 4px; transform: rotate(-3deg); animation: press 0.45s ease-out both; }
.stamp.s2 { color: var(--ok); } .stamp.s1 { color: var(--violet); } .stamp.s0 { color: var(--stamp); }
@keyframes press { from { transform: rotate(-3deg) scale(1.6); opacity: 0; } 60% { transform: rotate(-3deg) scale(0.96); opacity: 1; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
.real { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 16px; display: grid; gap: 10px; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.55em - 1px), var(--rule) calc(1.55em - 1px), var(--rule) 1.55em); background-position: 0 2.6em; background-size: 100% 1.55em; background-repeat: repeat-y; }
.real h3 { font-family: var(--font-type); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.real .rs { font-weight: 600; }
.src { font-family: var(--font-type); font-size: 0.8rem; color: var(--muted); display: grid; gap: 2px; }
.warn { border: 2px dashed var(--stamp); padding: 12px 14px; display: grid; gap: 6px; background: var(--paper); }
.warn h3 { font-family: var(--font-type); color: var(--stamp); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* Summary */
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score { border: 1px solid var(--rule); background: var(--card); padding: 10px 12px; display: grid; gap: 2px; }
.score .n { font-family: var(--font-type); font-weight: 700; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score .l { font-family: var(--font-type); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-left: 2px solid var(--ink); }
.tl li { position: relative; padding: 0 0 14px 16px; display: grid; gap: 3px; min-width: 0; }
.tl li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 50%; }
.tl .y { font-family: var(--font-type); font-weight: 700; font-variant-numeric: tabular-nums; }
.tl .pair { display: grid; grid-template-columns: 6.2em 1fr; gap: 2px 8px; font-size: 0.93rem; }
.tl .pair span:nth-child(odd) { font-family: var(--font-type); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding-top: 2px; }
.mini { font-family: var(--font-stamp); font-size: 0.8rem; letter-spacing: 0.08em; border: 2px solid currentColor; padding: 0 5px; justify-self: start; }
.mini.s2 { color: var(--ok); } .mini.s1 { color: var(--violet); } .mini.s0 { color: var(--stamp); }
.links { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.links a { font-family: var(--font-type); font-weight: 700; display: inline-block; padding: 6px 0; }
.epi { display: grid; gap: 8px; }
.epi div { display: grid; grid-template-columns: 7.6em 1fr; gap: 8px; font-size: 0.95rem; }
.epi b { font-family: var(--font-type); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 6px; font-size: 0.95rem; }
.legend div { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; }
.legend b { font-family: var(--font-type); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
.fine { font-size: 0.85rem; color: var(--muted); }
.reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-family: var(--font-type); font-size: 0.85rem; }
.link { background: none; border: 0; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--muted); }
.link.danger { color: var(--stamp); }

/* Bottom action bar */
.act { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--folder); border-top: 1px solid var(--folder-edge);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.act .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.act .hint { font-family: var(--font-type); font-size: 0.9rem; color: var(--muted); flex: 1; }
.prim { flex: 1; min-height: 52px; background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; font-family: var(--font-type); font-weight: 700;
  font-size: 1.05rem; letter-spacing: 0.04em; cursor: pointer; padding: 10px 16px; }
.prim:active { transform: translateY(1px); }

@media (max-width: 420px) {
  .gauges { gap: 5px 10px; }
  .g { grid-template-columns: 4.6em 1fr auto; font-size: 0.74rem; }
  .g .v { min-width: 3.9em; }
  .year { font-size: 1.8rem; }
  .sheet { padding: 16px 14px 18px; }
  .tl .pair { grid-template-columns: 1fr; }
  .epi div, .legend div { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } .bar i { transition: none; } }
</style>

  ];

    9: "9. tétel: Külpolitika, 1945-1990",

  };
  var TT = "https://ti-zariguin.github.io/muhely/tudastar/kadar-kor/";
  var LINKS = [
    { href: TT + "puha-diktatura/", label: "A puha diktatúra, 1963-1985" },
    { href: TT + "kulpolitika/", label: "Külpolitika a Kádár-korban" },
    { href: TT + "rendszervaltozas/", label: "A rendszerváltozáshoz vezető út" },
    { href: TT + "idovonal/", label: "Idővonal" }
  ];

  // match: 2 = what the leadership actually did, 1 = partly, 0 = not.
  // d: meter shifts of the proposal; press: pressure of the era, applied whatever you propose.
  var D = [
    {
      id: "amnesztia", year: "1962-1963", title: "A magyar kérdés és az amnesztia", src: [9], topic: "kulpolitika",
      sit: [
        "1956 óta a „magyar kérdés” évről évre az ENSZ-közgyűlés napirendjén van. Kádárt csak a Varsói Szerződés államai, Jugoszlávia és Kína ismerik el, a magyar kisebbséggel élő szomszédok is hűvösek.",
        "Az ország krónikus devizahiánnyal küzd, nyugati kapcsolatok kellenének, ehhez pedig előbb Washingtonnal kell megegyezni. Az USA 1961 augusztusa óta alkut kínál: általános amnesztiáért cserébe leveszik a magyar kérdést a napirendről. A végső szó Moszkváé."

      opts: [
        { s: "Alku: amnesztia a napirendért", t: "Fogadjuk el az alkut. Általános amnesztia, cserébe a magyar kérdés lekerül a napirendről. Hruscsov jóváhagyását ehhez meg kell szerezni.", match: 2, d: { M: -3, N: 10, G: 6, R: 8 } },
        { s: "Csendes egyéni kegyelmek", t: "Egyéni kegyelmek csendben, alku nélkül. A magyar kérdést továbbra is belügyeinkbe való beavatkozásnak nevezzük.", match: 1, d: { M: 4, N: 2, G: -4, R: -3 } },
        { s: "Elutasítás", t: "Utasítsuk el. A megtorlás lezárása belügy, a Nyugat ne szabjon feltételt.", match: 0, d: { M: 6, N: -7, G: -8, R: -6 } }
      ],
      press: {},
      rs: "Alku, 1963: általános amnesztia",

      why: "A rendezést mindkét fél akarta, de más okból: az USA azt várta, hogy Magyarország lassan távolodjon a Szovjetuniótól, Kádár pedig a szovjet jelenlét elfogadtatását. A devizahiány miatt a nyugati nyitás gazdasági kényszer is volt. Az egyéni kegyelem útja nem lett volna elég: korábban, 1960-as ENSZ-beszédében Kádár még belügynek nevezte a kérdést, és a küldöttek hűvösen fogadták."

    {

        "Júniusban egy prágai lap Nagy Imrére emlékezik, megjelenik a 2000 szó című röpirat. Júliusban az Ötök újra tanácskoznak Varsóban, Dubček nem megy el. Az MSZMP Politikai Bizottságában senki nem támogat katonai akciót."
      ],

      : { title: "A Brezsnyev-doktrína árnyéka", t: "1968 szeptembere óta a szovjet felfogás szerint a szocialista vívmányok megvédése minden szocialista ország kötelessége. Ezután fokozódott a beavatkozás a blokkban: Gomułkát és Ulbrichtot leváltották, és Kádár ellen is voltak puccstervek. Ekkora bizalomvesztés mellett a mozgástér nem a budapesti vezetésé.", src: [9] };
    if (k === "N") return late
      ? { title: "Megszűnő alku", t: "1985 után a reáljövedelmek is csökkentek, és az életszínvonal-alku elveszítette legitimáló szerepét. 1988 augusztusában a pécsi bányászok évtizedek óta az első sztrájkot tartották, a tüntetések egyre nagyobbak lettek.", src: [10] }
      : { title: "Az életszínvonal a tét", t: "A rendszer hallgatólagos alkuja az életszínvonalra épült. 1978-ban, amikor a törlesztést már csak újabb hitelből lehetett fedezni, a vezetés még akkor sem mert hozzányúlni. A nyugalom elfogyása 1956 után a legkényesebb jel.", src: [7] };
    if (k === "G") return { title: "Üres kassza", t: "1978-ban a törlesztést már csak újabb hitelből lehetett fedezni, 1982-ben pedig az egyensúlyhoz szovjet és világbanki segítség kellett. A következő lépéseknél a hitelezők feltételei is számítanak.", src: [7] };
    return { title: "Pangás", t: "A diasor a hetvenes évek közepét a változatlanság és a „pangás” időszakaként írja le: a régi gazdasági szerkezet fenntartása, a világpiaci válság hazai hatásainak tagadása. A reform lendülete elfogyott, és ennek ára később, növekvő adósságban jelentkezik.", src: [7] };
  }

  function clamp(v) { return Math.max(0, Math.min(100, v)); }
  function start() { return { v: 1, i: 0, phase: "intro", m: { M: START.M, N: START.N, G: START.G, R: START.R }, picks: [] }; }

  function choose(S, k) {
    if (S.phase !== "q") return null;
    var d = D[S.i], o = d.opts[k];
    if (!o) return null;
    var before = {}, delta = {}, warns = [];
    METERS.forEach(function (mt) {
      var x = mt.k; before[x] = S.m[x];
      var dv = (o.d[x] || 0) + (d.press[x] || 0);
      S.m[x] = clamp(S.m[x] + dv);
      if (S.m[x] <= 0) { warns.push(x); S.m[x] = RESET; }
      delta[x] = S.m[x] - before[x];
    });
    var bal = 0; METERS.forEach(function (mt) { if (S.m[mt.k] >= LOW && S.m[mt.k] <= HIGH) bal++; });
    var rec = { k: k, match: o.match, bal: bal, delta: delta, warns: warns };
    S.picks.push(rec); S.phase = "real";
    return rec;
  }
  function next(S) { if (S.phase !== "real") return; S.i++; S.phase = S.i >= D.length ? "end" : "q"; }
  function begin(S) { if (S.phase === "intro") S.phase = "q"; }

  function score(S) {
    var hit = 0, bal = 0, falls = 0;
    S.picks.forEach(function (p) { hit += p.match === 2 ? 10 : p.match === 1 ? 4 : 0; bal += p.bal; falls += p.warns.length; });
    var n = D.length;
    var hitPct = Math.round(hit / (n * 10) * 100);
    var balPct = Math.max(0, Math.round((bal - falls * 2) / (n * 4) * 100));
    var exact = S.picks.filter(function (p) { return p.match === 2; }).length;
    var rank = hitPct >= 85 ? { t: "Előléptetés: osztályvezető", d: "A javaslataid szinte szó szerint egyeznek azzal, amit a vezetés lépett. A kor logikáját belülről ismered." }
      : hitPct >= 60 ? { t: "Elvtársi dicséret", d: "A vezetés gondolkodását jól olvasod, néhány ponton a magad útját jártad." }
      : hitPct >= 35 ? { t: "Áthelyezés egy kutatóintézetbe", d: "Sokszor mást javasoltál, mint ami történt. A hivatal ezt önálló gondolkodásnak könyveli el, és nem feltétlenül dicséretként." }
      : { t: "Iktatva, olvasatlanul", d: "A javaslataid egy másik történelemhez illenének. Érdemes a „Mi történt valójában” lapokat újra átnézni." };
    return { hit: hit, hitPct: hitPct, bal: bal, balPct: balPct, falls: falls, exact: exact, rank: rank };
  }

  return { METERS: METERS, START: START, LOW: LOW, HIGH: HIGH, RESET: RESET, SRC: SRC, LINKS: LINKS, TT: TT, D: D, EPILOGUE: EPILOGUE,
    warning: warning, start: start, begin: begin, choose: choose, next: next, score: score };
})();

(function () {
  "use strict";
  var KEY = "mozgaster-v1";
  var S = null, confirmReset = false;
  var D = SIM.D, LET = ["A", "B", "C"], STAMP = ["ELTÉR", "RÉSZBEN", "EGYEZIK"];

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function valid(s) {
    if (!s || s.v !== 1 || !s.m || !Array.isArray(s.picks) || typeof s.i !== "number") return false;
    var want = { intro: 0, q: s.i, real: s.i + 1, end: D.length }[s.phase];
    if (want === undefined || s.picks.length !== want) return false;
    if (s.phase === "end" ? s.i !== D.length : (s.i < 0 || s.i >= D.length)) return false;
    return SIM.METERS.every(function (mt) { return typeof s.m[mt.k] === "number"; });
  }
  function load() { try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (valid(s)) return s; } } catch (e) {} return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function srcLine(list) { return list.map(function (n) { return SIM.SRC[n]; }).join("; "); }
  function signed(v) { return (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v); }

  function renderTab() {
    var last = S.phase === "real" ? S.picks[S.picks.length - 1] : null;
    var d = D[Math.min(S.i, D.length - 1)];
    var caseTxt = S.phase === "intro" ? "Új dosszié" : S.phase === "end" ? "Lezárva, 1989" : "Ügy " + (S.i + 1) + "/" + D.length + " · " + d.year;
    var h = '<div class="row"><span class="brand">MOZGÁSTÉR</span><span class="case">' + esc(caseTxt) + '</span></div><div class="gauges">';
    SIM.METERS.forEach(function (mt) {
      var v = S.m[mt.k], dv = last ? last.delta[mt.k] : 0;
      h += '<div class="g" title="' + esc(mt.name) + '"><span class="l">' + esc(mt.short) + '</span><span class="bar' + (v < SIM.LOW ? " warn" : "") +
        '" role="meter" aria-label="' + esc(mt.name) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + v + '"><i style="width:' + v + '%"></i></span><span class="v">' +
        (last && dv ? '<span class="dv ' + (dv > 0 ? "up" : "down") + '">' + signed(dv) + "</span> " : "") + v + "</span></div>";
    });
    $("tab").innerHTML = h + "</div>";
  }

  function head(d, n) {
    return '<span class="corner">BIZALMAS</span><div class="head"><span>Ügyszám: <b>MT-' + esc(d.year.slice(0, 4)) + "/" + n + "</b></span><span>Tárgy: " + esc(d.title) + "</span></div>";
  }

  function viewIntro() {
    var h = '<article class="sheet"><span class="corner">BIZALMAS</span><div class="head"><span>Ügyszám: <b>MT-1963/0</b></span><span>Tárgy: Megbízás</span></div>' +
      '<h1>Tanácsadói dosszié, 1963-1989</h1><div class="typed">' +
      "<p>Te vagy a pártvezetés tanácsadója. Neved nincs, és az iratokban sem fog szerepelni. Tíz ügyben kérnek tőled javaslatot, 1963-tól 1989-ig.</p>" +
      "<p>Minden ügynél két-három lehetőség közül választasz. A javaslatod megmozdítja a négy mérőt, de a történelmet nem írja át: utána jön a lap arról, mi történt valójában, és miért.</p>" +
      "</div><h2>A négy mérő</h2><div class=\"legend\">" +
      "<div><b>Moszkva</b><span>A szovjet vezetés bizalma. Nélküle a mozgástér a nulla felé szűkül.</span></div>" +
      "<div><b>Nyugalom</b><span>A lakosság nyugalma, ami főleg az életszínvonalon múlik.</span></div>" +
      "<div><b>Gazdaság</b><span>Egyensúly, adósság, fizetőképesség.</span></div>" +
      "<div><b>Reform</b><span>Mennyi lendület maradt a változtatásra.</span></div></div>" +
      '<p class="fine">Pontozás: mennyire találod el, mit lépett a valódi vezetés, és mennyire tartod a mérőket a középső sávban (a két jel között). Ha egy mérő kifogy, figyelmeztetést kapsz a korból, és a játék megy tovább.</p>' +
      '<p class="fine">A tanácsadó kitalált szereplő. A valódi személyek és események a forrás szerint szerepelnek: egyetemi előadás-diasor (A jelenkori magyar történelem alapjai II.), 7., 9. és 10. tétel. Játékidő: kb. 15-25 perc. Az állás ebben a böngészőben mentődik.</p>' +
      "</article>";
    return h;
  }

  function viewQ() {
    var d = D[S.i], h = '<article class="sheet">' + head(d, S.i + 1) + '<div class="year">' + esc(d.year) + "</div><h1>" + esc(d.title) + '</h1><div class="typed">';
    d.sit.forEach(function (p) { h += "<p>" + esc(p) + "</p>"; });
    h += '</div><p class="ask">' + esc(d.q) + '</p><div class="opts">';
    d.opts.forEach(function (o, k) {
      h += '<button class="opt" type="button" id="opt-' + k + '" data-act="pick" data-k="' + k + '"><span class="key">' + LET[k] + '</span><span><span class="s">' + esc(o.s) + '</span><span class="t">' + esc(o.t) + "</span></span></button>";
    });
    return h + "</div>" + resetRow() + "</article>";
  }

  function viewReal() {
    var d = D[S.i], p = S.picks[S.i], o = d.opts[p.k];
    var h = '<article class="sheet">' + head(d, S.i + 1) + '<div class="year">' + esc(d.year) + "</div><h1>" + esc(d.title) + "</h1>" +
      '<div class="mine"><span class="lab">A javaslatod, ' + LET[p.k] + "</span><span>" + esc(o.t) + '</span></div><div class="chips">';
    SIM.METERS.forEach(function (mt) { var v = p.delta[mt.k]; h += '<span class="chip' + (v > 0 ? " up" : v < 0 ? " down" : "") + '">' + esc(mt.short) + " " + signed(v) + "</span>"; });
    h += "</div>" + (d.pressNote ? '<p class="press">' + esc(d.pressNote) + "</p>" : "");
    h += '<span class="stamp s' + p.match + '">' + STAMP[p.match] + "</span>";
    h += '<section class="real"><h3>Mi történt valójában</h3><p class="rs">' + esc(d.rs) + ".</p><p>" + esc(d.real) + "</p><h3>Miért</h3><p>" + esc(d.why) + "</p></section>";
    p.warns.forEach(function (k) {
      var w = SIM.warning(k, S.i);
      h += '<section class="warn"><h3>Figyelmeztetés: ' + esc(w.title) + "</h3><p>" + esc(w.t) + '</p><p class="fine">A mérő ' + SIM.RESET + "-re áll vissza, az egyensúly-pontszámból levonás jár. Forrás: " + esc(srcLine(w.src)) + ".</p></section>";
    });
    h += '<div class="src"><span>Forrás: egyetemi előadás-diasor (A jelenkori magyar történelem alapjai II.), ' + esc(srcLine(d.src)) + '.</span><span>Tovább olvasva: <a href="' + SIM.TT + d.topic + '/" target="_blank" rel="noopener">Tudástár, ' +
      esc(SIM.LINKS.filter(function (l) { return l.href === SIM.TT + d.topic + "/"; })[0].label) + "</a></span></div>";
    return h + resetRow() + "</article>";
  }

  function viewEnd() {
    var sc = SIM.score(S);
    var h = '<article class="sheet"><span class="corner">LEZÁRVA</span><div class="head"><span>Ügyszám: <b>MT-1989/Z</b></span><span>Tárgy: Összesítő jelentés</span></div>' +
      "<h1>Összesítő jelentés</h1>" +
      '<div class="scores"><div class="score"><span class="n">' + sc.hitPct + '%</span><span class="l">Egyezés a valósággal</span><span class="fine">' + sc.exact + " ügyben pontos találat</span></div>" +
      '<div class="score"><span class="n">' + sc.balPct + '%</span><span class="l">Egyensúly</span><span class="fine">' + (sc.falls ? sc.falls + " kifogyott mérő" : "Egy mérő sem fogyott ki") + "</span></div></div>" +
      '<span class="stamp s' + (sc.hitPct >= 60 ? 2 : sc.hitPct >= 35 ? 1 : 0) + '">BESOROLVA</span><p><b>' + esc(sc.rank.t) + ".</b> " + esc(sc.rank.d) + "</p>" +
      "<h2>A javaslataid és a valóság</h2><ol class=\"tl\">";
    D.forEach(function (d, i) {
      var p = S.picks[i]; if (!p) return;
      h += '<li><span class="y">' + esc(d.year) + " · " + esc(d.title) + '</span><span class="mini s' + p.match + '">' + STAMP[p.match] + '</span><div class="pair"><span>Te</span><span>' +
        esc(d.opts[p.k].s) + "</span><span>Valójában</span><span>" + esc(d.rs) + "</span></div></li>";
    });
    h += "</ol><h2>Utóirat, 1989</h2><div class=\"epi\">";
    SIM.EPILOGUE.forEach(function (e) { h += "<div><b>" + esc(e.date) + "</b><span>" + esc(e.t) + "</span></div>"; });
    h += "</div><h2>Tovább a Tudástárba</h2><ul class=\"links\">";
    SIM.LINKS.forEach(function (l) { h += '<li><a href="' + l.href + '" target="_blank" rel="noopener">' + esc(l.label) + "</a></li>"; });
    h += '</ul><p class="fine">Forrás: egyetemi előadás-diasor (A jelenkori magyar történelem alapjai II.), 7., 9. és 10. tétel. A tanácsadó és a javaslatai kitaláltak, a „valójában” lapok a diasort követik.</p></article>';
    return h;
  }

  function resetRow() {
    return '<div class="reset">' + (confirmReset
      ? '<span>Az eddigi javaslatok törlődnek.</span><button class="link danger" type="button" id="reset-yes" data-act="reset-yes">Igen, új dosszié</button><button class="link" type="button" id="reset-no" data-act="reset-no">Mégsem</button>'
      : '<button class="link" type="button" id="reset-ask" data-act="reset-ask">Új dosszié</button>') + "</div>";
  }

  function renderAct() {
    var h = '<div class="in">';
    if (S.phase === "intro") h += '<button class="prim" type="button" id="act-begin" data-act="begin">Dosszié megnyitása</button>';
    else if (S.phase === "q") h += '<span class="hint">Válassz egy javaslatot (A, B' + (D[S.i].opts.length > 2 ? " vagy C" : "") + ").</span>";
    else if (S.phase === "real") h += '<button class="prim" type="button" id="act-next" data-act="next">' + (S.i + 1 < D.length ? "Következő ügy: " + esc(D[S.i + 1].year) : "Összesítő jelentés") + "</button>";
    else h += confirmReset
      ? '<button class="prim" type="button" id="act-reset-yes" data-act="reset-yes">Igen, kezdjük újra</button><button class="link" type="button" id="act-reset-no" data-act="reset-no">Mégsem</button>'
      : '<button class="prim" type="button" id="act-reset" data-act="reset-ask">Új dosszié</button>';
    $("act").innerHTML = h + "</div>";
  }

  function render(top) {
    renderTab();
    $("view").innerHTML = S.phase === "intro" ? viewIntro() : S.phase === "q" ? viewQ() : S.phase === "real" ? viewReal() : viewEnd();
    renderAct();
    if (top) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!b) return;
    var a = b.dataset.act, top = true;
    if (a === "begin") SIM.begin(S);
    else if (a === "pick") SIM.choose(S, +b.dataset.k);
    else if (a === "next") SIM.next(S);
    else if (a === "reset-ask") { confirmReset = true; top = false; }
    else if (a === "reset-no") { confirmReset = false; top = false; }
    else if (a === "reset-yes") { confirmReset = false; S = SIM.start(); }
    else return;
    if (a !== "reset-ask" && a !== "reset-no") confirmReset = false;
    save(); render(top);
  });

  function start(data) {
    S = data && valid(data.S) ? data.S : (load() || SIM.start());
    render(false);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { S: S }; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
