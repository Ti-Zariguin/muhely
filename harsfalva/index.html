<style>
/* Layout: an old console-RPG menu game. Deep blue windows with a bright frame, a status bar on top, tabs at the bottom. Single dark theme by choice. */
:root {

  color-scheme: dark;
}
html, body { overflow-x: clip; }

  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }

.app { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }

.win { background: linear-gradient(180deg, var(--win), var(--win-2)); border: 3px solid var(--frame); border-radius: 8px;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #3a438f; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
svg.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.25em; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0; color: var(--accent); display: flex; gap: 8px; align-items: center; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.02rem; margin: 2px 0 0; color: var(--muted); }
p { margin: 0; }

/* Status bar: one compact row (name, health, hero level, gold) */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 7px 10px; gap: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top .row { display: grid; grid-template-columns: minmax(0, auto) minmax(70px, 1fr) auto; align-items: center; gap: 10px; font-family: var(--font-display); }
.top .nm { font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 9em; }
.top .stat { display: flex; gap: 10px; flex: none; font-family: var(--font-mono); font-size: 0.85rem; }
.top .stat b { color: var(--accent); }
.bar { height: 10px; background: var(--shade); border: 1px solid rgba(233, 230, 214, 0.4); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--hp); }
.bar.xp > i { background: var(--xp); } .bar.work > i { background: var(--accent); transition: width 0.1s linear; }

.hpline .bar { height: 12px; }

/* Tap targets on the scene */
.scene .hot { cursor: pointer; }
.scene .hot-box { fill: transparent; }
.scene .hot:hover .hot-box, .scene .hot:focus-visible .hot-box { fill: rgba(255, 211, 77, 0.22); }
.scene .hot:focus { outline: none; }
.map .mp-place:focus { outline: none; } .map .mp-place:focus-visible .mp-hit { fill: rgba(255, 211, 77, 0.3); }

.tip { color: var(--accent); }

/* Map: parchment SVG, the places are tap targets */
.map { border: 2px solid #8a6a3a; border-radius: 6px; overflow: hidden; background: #ecdcb4; }
.map-win { padding: 10px 8px; }

.map .mp-l { font: 700 17px var(--font-display); fill: #4a3420; paint-order: stroke; stroke: #ecdcb4; stroke-width: 3px; }

@media (prefers-reduced-motion: no-preference) { .map .mp-pin { animation: pin 1.4s ease-in-out infinite; } }

/* Scene: decorative SVG above the place and the fight */
.scene { position: relative; border: 3px solid var(--frame); border-radius: 8px; overflow: hidden; aspect-ratio: 12 / 5; max-height: 34vh; width: 100%; box-sizing: border-box;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #3a438f; background: #0d0a14; }
.scene[hidden] { display: none; }
.scene-svg { display: block; width: 100%; height: 100%; }
.scene .chip-t { position: absolute; right: 6px; top: 6px; font-family: var(--font-display); font-size: 0.75rem; color: var(--fg); background: rgba(5, 7, 20, 0.6); border-radius: 4px; padding: 1px 7px; }
.scene .ttl { position: absolute; left: 8px; top: 6px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: #fff; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, 0.7); }
.scene .mob { cursor: pointer; }

.scene .fx { font: 700 13px var(--font-display); paint-order: stroke; stroke: #05061a; stroke-width: 3px; }
@media (prefers-reduced-motion: no-preference) {

  .scene .chip { animation: chip 0.9s ease-out infinite; opacity: 0; }
  .scene .smoke { animation: smoke 3.3s linear infinite; opacity: 0; }
  .scene .flame { animation: flicker 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .scene .star { animation: twinkle 2.4s ease-in-out infinite alternate; }
  .scene .flap { animation: flap 0.35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  .scene .glow { animation: twinkle 1.2s ease-in-out infinite alternate; }
  .scene .hero:not(.hurt):not(.lunge) { animation: breathe 2.8s ease-in-out infinite; }
  .scene .hurt { animation: shake 0.4s ease-in-out 0.2s; }
  .scene .lunge { animation: lunge 0.45s ease-out; }
  .scene .mob.dead { transition: opacity 0.6s; }
  .scene .fx { animation: rise 1.4s ease-out both; }
}
@keyframes swing { 0% { transform: rotate(-75deg); } 55% { transform: rotate(-75deg); } 75% { transform: rotate(35deg); } 100% { transform: rotate(-75deg); } }
@keyframes chip { 0%, 70% { opacity: 0; transform: translate(0, 0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -12px); } }
@keyframes smoke { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 0.7; } 100% { opacity: 0; transform: translate(10px, -34px) scale(1.6); } }
@keyframes flicker { from { transform: scale(1, 1); } to { transform: scale(0.8, 1.15); } }
@keyframes twinkle { from { opacity: 1; } to { opacity: 0.45; } }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-0.4); } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.8px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
@keyframes lunge { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(16px); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(4px); } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }

/* Buttons and lists */
.btn { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 11px 12px; border: 2px solid var(--frame);
  border-radius: 6px; background: var(--win-2); font-family: var(--font-display); font-size: 1.02rem; min-height: 50px; min-width: 0; touch-action: manipulation; }
.btn:hover { background: #1c2884; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { color: var(--locked); border-color: var(--locked); cursor: default; background: transparent; }

.btn.sel { background: #2a3699; border-color: var(--accent); }
.btns { display: grid; gap: 8px; }
.btns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lab { display: grid; gap: 2px; min-width: 0; }
.lab .t { overflow-wrap: anywhere; }
.lab .d { font-family: var(--font-body); font-size: 0.82rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.slot { all: unset; box-sizing: border-box; aspect-ratio: 1; max-width: 100%; border: 2px solid rgba(233, 230, 214, 0.45); border-radius: 6px; background: var(--shade);
  display: grid; place-items: center; position: relative; cursor: pointer; }
.slot svg.ic { width: 46%; height: 46%; margin-bottom: 12%; }

.slot.sel { border-color: var(--accent); background: #2a3699; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.92rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.skill { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
.skill .lvl { font-family: var(--font-display); font-size: 1.2rem; color: var(--accent); min-width: 2ch; text-align: right; }
.skill .bar { grid-column: 2 / 4; }
.skill .xpn { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.log { font-family: var(--font-mono); font-size: 0.84rem; display: grid; gap: 3px; background: var(--shade); border-radius: 5px; padding: 8px 10px; max-height: 13em; overflow-y: auto; }
.log .new { color: var(--fg); } .log div { color: var(--muted); }
.log .good { color: var(--ok); } .log .bad { color: var(--hp); } .log .gold { color: var(--accent); }
details.logd { background: linear-gradient(180deg, var(--win), var(--win-2)); border: 3px solid var(--frame); border-radius: 8px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #3a438f; padding: 4px 12px; min-width: 0; }
details.logd[open] { padding-bottom: 10px; }
details.logd > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 0.84rem; min-height: 36px; }
details.logd > summary::-webkit-details-marker { display: none; }
details.logd > summary .last { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

details.logd[open] > summary .last { display: none; }
details.logd[open] > summary { grid-template-columns: auto 1fr auto; }
details.logd > summary:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }

/* Combat */
.foes { display: grid; gap: 6px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.foe { all: unset; box-sizing: border-box; display: grid; gap: 3px; align-content: start; padding: 6px 8px; border: 2px solid rgba(233, 230, 214, 0.45); border-radius: 6px; cursor: pointer; min-width: 0; touch-action: manipulation; }
.foe .nm { font-family: var(--font-display); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foe.sel { border-color: var(--accent); background: #2a3699; }
.foe.dead { opacity: 0.35; cursor: default; }
.foe .lv { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.order { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.fight-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.order b { color: var(--accent); font-weight: 600; }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--win-2); border-top: 3px solid var(--frame);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
nav.tabs button { all: unset; box-sizing: border-box; display: grid; justify-items: center; align-content: center; gap: 2px; padding: 6px 2px; border-radius: 6px; cursor: pointer;
  font-family: var(--font-display); font-size: 0.76rem; color: var(--muted); min-width: 0; min-height: 56px; touch-action: manipulation; }
nav.tabs button svg.ic { width: 24px; height: 24px; }
/* In a fight the tab bar turns into the command bar, right under the thumb. */
nav.tabs .in.cmds { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
nav.tabs .in.cmds button.btn { display: flex; justify-items: normal; align-content: normal; gap: 8px; padding: 8px 10px; min-height: 54px; border: 2px solid var(--frame);
  background: var(--win); color: var(--fg); font-size: 1rem; text-align: left; }
nav.tabs .in.cmds button.btn.prim { border-color: var(--accent); }
nav.tabs .in.cmds button.btn[disabled] { color: var(--locked); border-color: var(--locked); background: transparent; opacity: 1; }
nav.tabs .in.cmds button.btn svg.ic { width: 1.3em; height: 1.3em; }
nav.tabs .in.cmds .btn .d { font-size: 0.76rem; }
nav.tabs button[aria-pressed="true"] { color: var(--accent); background: rgba(255, 211, 77, 0.12); }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); }
nav.tabs button[disabled] { opacity: 0.35; cursor: default; }

/* Overlay and toast */
.ov { position: fixed; inset: 0; z-index: 20; background: rgba(5, 7, 20, 0.7); display: grid; place-items: center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.ov[hidden], .toast[hidden] { display: none; }
.ov .win { width: 100%; max-width: 480px; }
.ov h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 7vw, 2.3rem); margin: 0; line-height: 1.05; }
.ov input { font: 600 1.1rem var(--font-display); color: var(--fg); background: var(--shade); border: 2px solid var(--frame); border-radius: 6px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px)); z-index: 15; max-width: min(92vw, 480px);
  background: var(--win); border: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-family: var(--font-display); text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: pop 0.25s ease-out; } }
/* Grid combat: life grids made of cells */
:root { --foe: #c98a4b; --dead: #0a0d22; --armor: #c9d2e8; --poison: #7bd66b; --bleed: #ff3b5c; --shield: #6fb8ff; }
.gb { display: grid; gap: 3px; justify-content: center; touch-action: manipulation; }
.gc { all: unset; box-sizing: border-box; width: var(--cs); height: var(--cs); border-radius: 4px; position: relative; cursor: pointer; }
.gc:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gc.off { cursor: default; }
.gc.off.grow { border: 2px dashed var(--accent); background: rgba(255, 211, 77, 0.12); cursor: pointer; }
.gb.hero .gc.alive { background: var(--hp); }
.gb.foe .gc.alive { background: var(--foe); }
.gc.dead { background: var(--dead); box-shadow: inset 0 0 0 1px rgba(185, 190, 223, 0.2); }
.gc.dead::after { content: "×"; color: rgba(185, 190, 223, 0.35); font-size: 13px; position: absolute; inset: 0; display: grid; place-items: center; }
.gc.armor { box-shadow: inset 0 0 0 3px var(--armor); }
.gc.armor::before { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 11px; transform: translate(-50%, -50%);
  background: var(--armor); clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); opacity: 0.85; }
.gc.poison::after { content: ""; position: absolute; right: 3px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--poison); box-shadow: 0 0 6px var(--poison); }
.gc.bleed::after { content: attr(data-arrow); position: absolute; inset: 0; display: grid; place-items: center; color: var(--bleed); font-size: 16px; text-shadow: 0 0 3px #000; }
.gc.shield { box-shadow: inset 0 0 0 3px var(--shield), 0 0 8px var(--shield); }
.gc.threat::before { content: attr(data-who); position: absolute; inset: -2px; border: 2px solid var(--fg); border-radius: 5px; font: 700 9px var(--font-mono); color: var(--fg);
  display: grid; place-items: start end; padding: 0 2px; text-shadow: 0 0 2px #000; }
@media (prefers-reduced-motion: no-preference) { .gc.threat { animation: threat 1.1s ease-in-out infinite; } }
@keyframes threat { 50% { filter: brightness(1.45); } }
.gc.pv { outline: 3px solid var(--accent); outline-offset: -3px; filter: brightness(1.3); }
.gc.pv.bad { outline-color: #888; }
.foesg { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.foeg { display: grid; gap: 4px; justify-items: center; padding: 6px; border: 2px solid transparent; border-radius: 6px; min-width: 0; }
.foeg.dead { opacity: 0.35; }
.foeg .nm { font: 700 0.9rem var(--font-display); } .foeg .lv { font: 0.72rem var(--font-mono); color: var(--muted); }
.intent { font-size: 0.85rem; padding: 4px 6px; background: var(--shade); border-radius: 4px; border-left: 3px solid var(--hp); max-width: 15em; }
.intent b { color: var(--accent); }
.res { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-family: var(--font-display); font-size: 0.9rem; }
.res i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; vertical-align: -2px; }
.res i.full { background: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.card { all: unset; box-sizing: border-box; background: var(--shade); border: 2px solid rgba(233, 230, 214, 0.35); border-radius: 6px; padding: 6px; display: grid; gap: 4px; cursor: pointer; min-width: 0; }
.card:focus-visible { outline: 2px solid var(--accent); }
.card.sel { border-color: var(--accent); background: rgba(255, 211, 77, 0.12); }
.card[disabled] { opacity: 0.4; cursor: default; }
.card .t { font: 700 0.82rem var(--font-display); line-height: 1.15; }
.card .m { font: 0.68rem var(--font-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.mini { display: grid; gap: 2px; grid-auto-rows: 7px; grid-auto-columns: 7px; }

.hint { font-size: 0.85rem; color: var(--accent); min-height: 1.2em; }
/* Wide screens (monitor, landscape): in a fight the scene goes away, enemies | hero | cards side by side. */
@media (min-width: 900px) {

    h += logBox(40) + '<div class="btns">' + btn('data-reset="1"', "i-skull", "Új játék", "Minden elvész, előről kezded.", "") + "</div></section>";

  // ---------- Combat (grid) ----------
  // C: { F (GRID fight), boss, sel (card id), rot, dir, pv {side, i}, lines, fx }
  function startCombat(foes, boss) {
    stopGather();
    var F = GRID.start(S, foes, boss);
    GRID.plan(F, rnd);
    C = { F: F, foes: F.foes, boss: !!boss, sel: null, rot: 0, dir: 1, pv: null, lines: [], fx: [], target: 0, round: 1, quick: !boss && SIM.quickOk(S, foes) };
    cline((foes.length > 1 ? foes.length + " ellenfél" : foes[0].name) + " támad!");
    tab = "hely"; draw();
  }
  function cline(t, cls) { C.lines.unshift({ t: t, c: cls || "" }); if (C.lines.length > 30) C.lines.length = 30; }
  function cardList() { return GRID.actions(S); }
  function cardById(id) { return cardList().find(function (a) { return a.id === id; }); }
  // Cell size: on a wide screen each grid gets a column and the window height; on a phone the page width.
  function cs(w, cols, rows) {
    var W = window.innerWidth || 390, H = window.innerHeight || 800;
    if (W >= 900) return Math.max(18, Math.min(52, Math.floor((Math.min(W, 1240) - 400) / 2 / cols) - 3, Math.floor((H - 300) / (rows || 6)) - 3));
    return Math.max(18, Math.min(40, Math.floor((Math.min(W, 560) - w) / cols) - 3));
  }
  function boardHtml(b, side, foeIdx, size) {
    var F = C.F, threat = {};
    if (side === "hero") F.foes.forEach(function (f, k) { if (f.hp > 0 && f.intent) f.intent.cells.forEach(function (i) { threat[i] = (threat[i] || "") + (F.foes.length > 1 ? "ABC"[k] : ""); }); });
    var pvCells = null;
    if (C.pv && C.pv.side === (side === "hero" ? "hero" : "f" + foeIdx)) {
      var a = cardById(C.sel);
      pvCells = a ? GRID.cover(b, GRID.rotate(a.shape, C.rot), C.pv.i % b.w, Math.floor(C.pv.i / b.w)) : null;
    }
    var h = '<div class="gb ' + (side === "hero" ? "hero" : "foe") + '" style="--cs:' + size + "px;grid-template-columns:repeat(" + b.w + ',var(--cs))">';
    b.cells.forEach(function (c, i) {
      if (!c.on) { h += '<span class="gc off"></span>'; return; }
      var k = "gc " + (c.alive ? "alive" : "dead");
      if (c.alive && c.armor) k += " armor";
      if (c.poison) k += " poison";
      if (c.bleed) k += " bleed";
      if (c.shield) k += " shield";
      if (threat[i] !== undefined && c.alive) k += " threat";
      if (pvCells && pvCells.indexOf(i) >= 0) k += " pv";
      if (C.pv && !pvCells && C.pv.side === (side === "hero" ? "hero" : "f" + foeIdx) && C.pv.i === i) k += " pv bad";
      var lab = (c.alive ? "élő" : "elhalt") + (c.armor ? ", páncélos" : "") + (c.poison ? ", mérgezett" : "");
      h += '<button type="button" class="' + k + '" data-cell="' + (side === "hero" ? "hero" : foeIdx) + ":" + i + '"' + (threat[i] ? ' data-who="' + threat[i] + '"' : "") +
        (c.bleed ? ' data-arrow="' + GRID.DIRS[c.bleed.dir][2] + '"' : "") + ' aria-label="' + lab + '"></button>';
    });
    return h + "</div>";
  }
  function intentText(f) {
    var it = f.intent, mv = it.move;
    if (mv.howl) return "<b>" + mv.name + "</b>: a következő ütése átüti a páncélt.";
    if (mv.regrow) return "<b>" + mv.name + "</b>: " + mv.regrow + " sebe begyógyul.";
    if (mv.poison) return "<b>" + mv.name + "</b>: " + it.cells.length + " meződet megmérgezi.";
    return "<b>" + mv.name + "</b>: " + it.cells.length + " mező" + (it.power >= 2 ? ", átüti a páncélt" : "") + ".";
  }
  function shapeMini(a, r) {
    var sh = GRID.rotate(a.shape, r), k = a.heal ? "heal" : a.shield ? "def" : "";
    return '<span class="mini ' + k + '">' + sh.map(function (p) { return '<i style="grid-column:' + (p[0] + 1) + ";grid-row:" + (p[1] + 1) + '"></i>'; }).join("") + "</span>";
  }
  function viewCombat() {
    var F = C.F, many = F.foes.length;
    var h = '<section class="win"><div class="fight-h"><h2>' + ic("i-skull") + "Harc · " + F.round + '. kör</h2></div><div class="foesg">';
    F.foes.forEach(function (f, k) {
      var e = SIM.ENEMIES[f.id], size = cs(many > 1 ? 40 * many : 60, many > 1 ? Math.max(3, f.b.w) * many : Math.max(5, f.b.w), many > 1 ? f.b.h + 3 : f.b.h + 2);
      h += '<div class="foeg' + (f.hp <= 0 ? " dead" : "") + '"><span class="nm">' + esc(f.name + f.tag) + '</span><span class="lv">' + e.lvl + ". sz. · " + f.hp + "/" + f.max + " mező</span>" +
        boardHtml(f.b, "foe", k, size) + (f.hp > 0 && f.intent ? '<span class="intent">' + intentText(f) + "</span>" : "") + "</div>";
    });
    h += "</div></section>";
    var hb = F.hero;
    h += '<section class="win"><div class="fight-h"><h2>' + ic("i-heart") + esc(S.name) + '</h2><span class="order">' + GRID.alive(hb) + "/" + GRID.size(hb) + " mező</span></div>" +
      boardHtml(hb, "hero", -1, cs(60, Math.max(6, hb.w), hb.h + 1)) + "</section>";
    var res = '<div class="res"><span>Cselekvéspont</span> ' + Array.apply(null, Array(GRID.apMax(S))).map(function (x, k) { return "<i class='" + (k < F.ap ? "full" : "") + "'></i>"; }).join("") +
      (GRID.freeDaggers(S) ? "<span>· Tőr: " + F.free + "</span>" : "") + "</div>";
    var cards = cardList().map(function (a) {
      var dis = !GRID.canUse(F, a), right = a.free ? "ingyen" : a.ap + " CsP";
      return '<button type="button" class="card' + (C.sel === a.id ? " sel" : "") + '" data-card="' + a.id + '"' + (dis ? " disabled" : "") + '><span class="t">' + esc(a.name) + "</span>" +
        shapeMini(a, C.sel === a.id ? C.rot : 0) + '<span class="m"><span>' + right + "</span><span>" + esc(a.desc) + "</span></span></button>";
    }).join("");
    var hint = "";
    if (!C.sel) hint = "Válassz lapot, aztán koppints a rácsra.";
    else {
      var a = cardById(C.sel);
      hint = C.pv ? "Koppints ugyanoda még egyszer a lerakáshoz." : a && a.on === "foe" ? "Koppints egy ellenfél rácsára." : "Koppints a saját rácsodra.";
      if (a && a.bleed) hint += " Vérzés iránya: " + GRID.DIRS[C.dir][2];
    }
    h += '<section class="win">' + res + '<div class="hint">' + hint + '</div><div class="cards">' + cards + "</div>" +
      '<div class="log" aria-live="polite">' + C.lines.slice(0, 5).map(function (l, i) { return '<div class="' + (i === 0 ? "new " : "") + l.c + '">' + esc(l.t) + "</div>"; }).join("") + "</div></section>";
    return h;
  }
  // The bottom bar in a fight: rotate, end the round, flee or quick fight.
  function combatMenu() {
    var a = C.sel ? cardById(C.sel) : null;
    return btn('data-cmd="end"', "i-star", "Kör vége", "Az ellenfelek lépnek.", "", { prim: true }) +
      btn('data-cmd="rot"', "i-bolt", a && a.bleed ? "Irány " + GRID.DIRS[C.dir][2] : "Forgat", "", "", { dis: !a || (a.shape.length < 2 && !a.bleed) }) +
      (C.quick && C.F.round === 1 ? btn('data-cmd="quick"', "i-sword", "Gyors harc", "Jóval gyengébb ellenfél.", "") :
        btn('data-cmd="flee"', "i-run", "Menekülés", C.boss ? "Nem lehet." : SIM.fleeChance(S, GRID.living(C.F)) + "%", "", { dis: C.boss }));
  }
  function tapCell(key) {
    var parts = key.split(":"), side = parts[0] === "hero" ? "hero" : "f" + parts[0], i = +parts[1];
    var a = C.sel ? cardById(C.sel) : null;
    if (!a) return;
    var F = C.F, foeIdx = side === "hero" ? -1 : +parts[0];
    if ((a.on === "foe") !== (side !== "hero")) { cline(a.on === "foe" ? "Ez az ellenfél rácsára megy." : "Ez a saját rácsodra megy."); draw(); return; }
    var b = side === "hero" ? F.hero : F.foes[foeIdx].b;
    if (C.pv && C.pv.side === side && C.pv.i === i) {
      var res = GRID.act(F, S, a, foeIdx, i % b.w, Math.floor(i / b.w), C.rot, C.dir);
      if (res) {
        var s;
        if (a.shield) s = a.name + ": " + res.shield + " mező védve ebben a körben.";
        else if (a.heal) s = a.name + ": " + res.heal + " mező visszanőtt" + (res.cure ? ", " + res.cure + " méreg kitisztult" : "") + ".";
        else {
          var f = F.foes[foeIdx];
          s = a.name + " → " + f.name + f.tag + ": " + res.kill + " mező" + (res.armor ? ", " + res.armor + " páncél leverve" : "") + (a.bleed && res.kill && !SIM.ENEMIES[f.id].nobleed ? ", vérzik " + GRID.DIRS[C.dir][2] : "") + (res.stagger ? ", megtántorodik" : "") + ".";
          C.fx.push({ to: foeIdx, kind: res.kill ? "hit" : "miss", n: res.kill });
        }
        cline(s, "good");
        if (!GRID.canUse(F, a) || (a.food && !SIM.beltCount(S, a.food))) C.sel = null;
      }
      C.pv = null;
      if (F.over) return endCombat("won");
      save(); draw(); return;
    }
    C.pv = { side: side, i: i };
    draw();
  }
  var FOE_TEXT = { patkany: "a bokádba harap", farkas: "a lábadba mar", vaddiszno: "nekedront", goblin: "rozsdás késsel vág", goblinvezer: "lesújt a buzogányával",
    denever: "az arcodba csap", kobold: "csákánnyal üt", pok: "beléd marja a fogát", csontvaz: "csontkezével lecsap", koboldkiraly: "lesújt a koronás kalapácsával" };
  function endRound() {
    var F = C.F;
    C.fx = [];
    var rep = GRID.next(F, S, rnd);
    if (rep.bleed) cline("A vérzés " + rep.bleed + " mezőt vitt el.", "good");
    rep.lines.forEach(function (l) {
      var f = F.foes.find(function (x) { return x.name + x.tag === l.who; });
      var s = l.who + " – " + l.move + ": ";
      if (l.howl) s += "a következő ütése erősebb.";
      else if (l.regrow) s += l.regrow + " sebe begyógyult.";
      else if (l.poisoned) s += l.poisoned + " meződ mérgezett" + (l.blocked ? ", " + l.blocked + " a pajzson akadt el" : "") + ".";
      else s = l.who + " " + (f ? FOE_TEXT[f.id] : "támad") + ": " + l.hit + " meződ odaveszett" + (l.blocked ? ", " + l.blocked + " a pajzson akadt el" : "") + (l.armor ? ", " + l.armor + " páncél leverve" : "") + ".";
      cline(s, l.hit ? "bad" : "");
      if (l.hit || l.armor) C.fx.push({ to: "hero", kind: l.hit ? "hit" : "block", n: l.hit });
    });
    if (rep.poison) cline("A méreg " + rep.poison + " mezőt vitt el.", "bad");
    C.sel = null; C.pv = null; C.round = F.round;
    if (F.over === "win") return endCombat("won");
    if (F.over === "lose") return endCombat("dead");
    save(); draw();
  }
  function flee() {
    if (rnd() * 100 < SIM.fleeChance(S, GRID.living(C.F))) { cline("Elmenekülsz."); return endCombat("fled"); }
    cline("Nem sikerül elmenekülni.", "bad");
    endRound();
  }
  function quickFight() {
    var foes = C.F.foes.map(function (f) { return { id: f.id, name: f.name, tag: f.tag, max: f.max }; });
    var q = GRID.quick(S, foes, rnd);
    cline("Gyors harc: " + foes.map(function (f) { return f.name + f.tag; }).join(", ") + " legyőzve" + (q.lost ? ", " + q.lost + " meződ odaveszett" : "") + ".", "good");
    levelUps(q.ups);
    C.quickDone = true;
    endCombat("won");
  }
  function lootAll() {
    C.F.foes.forEach(function (f) {
      var l = SIM.loot(S, f, rnd);
      cline(f.name + f.tag + " legyőzve." + (l.gold ? " +" + l.gold + " arany." : "") + (l.items.length ? " Zsákmány: " + l.items.map(function (x) { var id = x.split("@")[0]; return I[id].name + (x.indexOf("@") > 0 ? " (ládába, tele a zsák)" : ""); }).join(", ") + "." : ""), "gold");
      levelUps(l.ups);
    });
  }
  function endCombat(how) {

    if (!C.quickDone) levelUps(GRID.finish(C.F, S));
    if (how === "won") lootAll();
    C.lines.slice(0, 4).reverse().forEach(function (l) { note(l.t, l.c); });
    C = null;
    if (S.grow > 0) toast(ic("i-heart") + " " + S.grow + ' új mező vár<div class="small muted">Tudások fül: rakd le a rácsodra.</div>');
    if (how === "dead") {
      S.deaths++; SIM.healAll(S); S.loc = "falu"; place = "fogado";
      note("Elestél. A fogadóban ébredsz, Bende teát hoz.", "bad");
      overlay('<h2>' + ic("i-skull") + 'Elestél</h2><p>Sötétség, aztán kamillaszag. A fogadóban ébredsz, Bende egy bögre teát tesz melléd.</p><p class="muted small">Semmit nem veszítettél. Pihenj, egyél, és próbáld újra.</p><div class="btns">' + btn('data-ov="close"', "i-bed", "Felkelsz", "", "", { prim: true }) + "</div>");
    } else if (how === "fled") note("Elmenekültél.");
    else {
      note("Győzelem: " + names.join(", ") + ".", "good");
      if (wasBoss && SIM.count(S, "banyakulcs") > 0 && S.quest === 2) overlay('<h2>' + ic("i-key") + 'A goblin vezér elesett</h2><p>Az övén egy rozsdás, nehéz kulcs lóg. A Régi bánya kapujához illik. Vidd vissza a fogadóba.</p><div class="btns">' + btn('data-ov="close"', "i-star", "Tovább", "", "", { prim: true }) + "</div>");
      if (wasBoss && SIM.count(S, "kincs") > 0 && S.quest === 4) overlay('<h2>' + ic("i-chest") + 'A kobold király elesett</h2><p>A trón mögött ott a falu elveszett kincse: egy láda ezüst, egy régi pecsét és egy megsárgult térkép. Vidd haza Hársfalvára.</p><div class="btns">' + btn('data-ov="close"', "i-star", "Tovább", "", "", { prim: true }) + "</div>");
    }
    save(); draw();
  }

  // ---------- Gathering ----------
  function startGather(node) {
    var why = SIM.gatherCheck(S, node);
    if (why) { note(why, "bad"); draw(); return; }
    G = { node: node, start: performance.now(), dur: SIM.gatherTime(S, node) * 1000 };
    draw();
  }
  function stopGather() { G = null; }
  function gatherTick(now) {
    if (!G) return;
    var f = (now - G.start) / G.dur, bar = $("workbar");
    if (bar) bar.style.width = Math.min(100, f * 100).toFixed(1) + "%";
    if (f < 1) return;
    var nd = SIM.NODES[G.node], ups = SIM.gatherDone(S, G.node);
    levelUps(ups);
    var a = SIM.AREAS[S.loc];
    if (rnd() < a.ambush) { note("Valami kiugrik a bokorból!", "bad"); save(); startCombat(SIM.encounter(S.loc, rnd, S)); return; }
    var why = SIM.gatherCheck(S, G.node);
    if (why) { note(why + " Abbahagyod.", "bad"); G = null; save(); draw(); return; }
    G.start = now; G.dur = SIM.gatherTime(S, G.node) * 1000;
    save();
    if (tab === "hely") draw();
    else drawTop();
  }

  // ---------- Quests ----------
  function questTake() {
    var q = SIM.QUESTS[S.quest];
    S.questTaken = true;
    if (S.quest === 0) { SIM.add(S, "rozsdas_fejsze"); note("Bende a kezedbe nyom egy rozsdás fejszét.", "gold"); }
    if (S.quest === 1) { SIM.add(S, "rozsdas_csakany"); note("Ágota odaadja a régi csákányát.", "gold"); }
    note("Új küldetés: " + q.title + ".", "good");
  }
  function questDone() {
    var q = SIM.QUESTS[S.quest];
    if (q.need) Object.keys(q.need).forEach(function (k) { SIM.remove(S, k, q.need[k]); });
    S.gold += q.reward || 0;
    note("Küldetés kész: " + q.title + "." + (q.reward ? " +" + q.reward + " arany." : ""), "gold");
    if (S.quest === 2) { SIM.remove(S, "banyakulcs", 1); S.flags.banya = true; S.quest = 3; S.questTaken = true; note("Megnyílt a Régi bánya.", "good"); return; }
    if (S.quest === 4) { SIM.remove(S, "kincs", 1); S.flags.done = true; S.quest = 5; S.questTaken = false; ending(); return; }
    S.quest++; S.questTaken = false;
  }
  function ending() {
    overlay('<h1>Hársfalva megmenekült</h1><p>A kincs visszakerül a templom alá, a kovács újra dalol, a fogadóban egész éjjel szól a duda.</p>' +
      "<p>A sarokban egy csuklyás idegen ül. Amikor odanézel, felemeli a poharát. „Láttalak a bányában. Nem rossz. Ha tovább mész, veled tartanék.”</p>" +
      '<p class="muted">Folytatás hamarosan. Addig tovább gyakorolhatod a tudásaidat.</p><div class="btns">' + btn('data-ov="close"', "i-star", "Tovább játszom", "", "", { prim: true }) + "</div>");
  }

  // ---------- Overlay and intro ----------
  function overlay(html) { $("ov").innerHTML = '<div class="win">' + html + "</div>"; $("ov").hidden = false; var b = $("ov").querySelector("button, input"); if (b) b.focus(); }
  function closeOv() { $("ov").hidden = true; $("ov").innerHTML = ""; }
  var INTRO = [
    "A Hársfalvára vezető úton a hársfák már sárgulnak. A hátizsákodban egy váltás ruha, egy darab kenyér és tíz arany.",
    "A faluban rossz idők járnak. A kovács beteg, a kemence hideg, a nyájat goblinok dézsmálják, és a régi bánya kapuja évek óta zárva.",
    "A fogadós, Bende, munkát keres valakinek, aki nem fél egy kis fától, egy kis vastól és egy kis vértől."
  ];
  function intro(i) {
    if (i < INTRO.length) { overlay((i === 0 ? "<h1>Hársfalva krónikája</h1>" : "") + "<p>" + INTRO[i] + '</p><div class="btns">' + btn('data-ov="intro' + (i + 1) + '"', "i-star", "Tovább", "", (i + 1) + "/" + INTRO.length, { prim: true }) + "</div>"); return; }
    overlay('<h2>Hogy hívnak, vándor?</h2><label for="hero-name" class="small muted">A hős neve</label><input id="hero-name" maxlength="18" autocomplete="off" value="Vándor"><div class="btns">' + btn('data-ov="name"', "i-star", "Indulás", "", "", { prim: true }) + "</div>");
  }

  // ---------- Events ----------
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-tab],[data-place],[data-go],[data-gather],[data-stop],[data-look],[data-boss],[data-quest],[data-rest],[data-buy],[data-sell],[data-stash],[data-take],[data-inv],[data-use],[data-unequip],[data-craft],[data-cmd],[data-card],[data-cell],[data-main],[data-grow],[data-unbelt],[data-ov],[data-reset]");
    if (!el || el.disabled) return;
    var d = el.dataset;
    if (d.ov) {
      if (d.ov.indexOf("intro") === 0) return intro(+d.ov.slice(5));
      if (d.ov === "name") { var nm = ($("hero-name").value || "").trim().slice(0, 18) || "Vándor"; S = SIM.newState(nm); place = "fogado"; note("Megérkeztél Hársfalvára. A fogadóban munka vár.", "good"); closeOv(); save(); draw(); return; }
      if (d.ov === "reset") { try { localStorage.removeItem(KEY); } catch (e) {} S = null; G = null; C = null; tab = "hely"; intro(0); return; }
      closeOv(); draw(); return;
    }
    if (!S) return;
    if (d.tab) { tab = d.tab; invSel = -1; draw(); window.scrollTo(0, 0); return; }
    if (d.place) { place = place === d.place && !ev.target.closest(".scene") ? null : d.place; if (d.place === "kovacs" || d.place === "tuzhely") { tab = "barkacs"; place = null; } draw(); return; }
    if (d.go) {
      stopGather(); S.loc = d.go; tab = "hely"; place = null;
      note("Megérkezel: " + SIM.AREAS[d.go].name + ".");
      if (d.go === "banya" && S.quest === 3) { note("Küldetés kész: A bánya kulcsa.", "gold"); S.quest = 4; S.questTaken = true; note("Új küldetés: A kobold király.", "good"); }
      save(); draw(); window.scrollTo(0, 0); return;
    }
    if (d.gather) return startGather(d.gather);
    if (d.stop) { stopGather(); note("Abbahagyod."); draw(); return; }
    if (d.look) { stopGather(); return startCombat(SIM.encounter(S.loc, rnd, S)); }
    if (d.boss) { var b = SIM.AREAS[S.loc].boss, f = SIM.spawn(b); f.tag = ""; return startCombat([f], true); }
    if (d.quest) { if (d.quest === "take") questTake(); else questDone(); save(); draw(); return; }
    if (d.rest) { SIM.healAll(S); note("Kipihented magad. Minden meződ visszanőtt.", "good"); save(); draw(); return; }
    if (d.main) { if (S.loc !== "falu" || C) return; if (S.main.indexOf(d.main) < 0) { S.main = [S.main[1], d.main]; note("Harci irány: " + S.main.map(SIM.skillName).join(" és ") + "."); } save(); draw(); return; }
    if (d.grow) { if (d.grow === "auto") SIM.autoGrow(S); else SIM.grow(S, +d.grow); save(); draw(); return; }
    if (d.unbelt) { var bs = S.belt[+d.unbelt]; if (bs && !C) { var moved2 = 0; while (bs.n > 0 && (S.inv.some(function (x) { return x.id === bs.id; }) || SIM.freeSlots(S) > 0)) { var ex = S.inv.find(function (x) { return x.id === bs.id; }); if (ex) ex.n++; else S.inv.push({ id: bs.id, n: 1 }); bs.n--; moved2++; } if (bs.n <= 0) S.belt.splice(+d.unbelt, 1); note(moved2 ? "Visszatetted a hátizsákba." : "Tele a hátizsák.", moved2 ? "" : "bad"); } save(); draw(); return; }
    if (d.buy) { var it = I[d.buy]; if (S.gold >= it.buy && SIM.canAdd(S, d.buy)) { S.gold -= it.buy; SIM.add(S, d.buy, 1); note("Megvetted: " + it.name + "."); } else note(S.gold < it.buy ? "Nincs elég aranyad." : "Tele a hátizsák.", "bad"); save(); draw(); return; }
    if (d.sell) { var s = S.inv[+d.sell]; if (s) { var gain = I[s.id].price * s.n; S.gold += gain; note("Eladtad: " + I[s.id].name + (s.n > 1 ? " ×" + s.n : "") + ". +" + gain + " arany.", "gold"); S.inv.splice(+d.sell, 1); } save(); draw(); return; }
    if (d.stash) { var moved = 0; S.inv = S.inv.filter(function (x) { if (I[x.id].kind === "mat") { S.bank[x.id] = (S.bank[x.id] || 0) + x.n; moved += x.n; return false; } return true; }); note(moved ? moved + " alapanyag a ládában." : "Nincs mit betenni."); save(); draw(); return; }
    if (d.take) { var k = d.take, n = 0; while (S.bank[k] > 0 && SIM.canAdd(S, k) && (n === 0 || I[k].kind === "mat" || I[k].kind === "food")) { SIM.add(S, k, 1); S.bank[k]--; n++; if (!(I[k].kind === "mat" || I[k].kind === "food")) break; } if (!n) note("Tele a hátizsák.", "bad"); else note("Kivetted: " + I[k].name + (n > 1 ? " ×" + n : "") + "."); save(); draw(); return; }
    if (d.inv) { invSel = invSel === +d.inv ? -1 : +d.inv; draw(); return; }
    if (d.use) {
      var sl = S.inv[invSel]; if (!sl) return;
      if (d.use === "equip") { SIM.equip(S, invSel); note("Felveszed: " + I[sl.id].name + "."); }
      if (d.use === "eat") { if (C) { invSel = -1; tab = "hely"; draw(); return; } var b0 = S.hp; SIM.healCells(S, healN(sl.id)); S.inv[invSel].n--; if (S.inv[invSel].n <= 0) S.inv.splice(invSel, 1); note("Megeszed: " + I[sl.id].name + ". +" + (S.hp - b0) + " mező.", "good"); }
      if (d.use === "belt") { var bb = S.belt.find(function (x) { return x.id === sl.id; }); if (!bb && S.belt.length < SIM.BELT) { bb = { id: sl.id, n: 0 }; S.belt.push(bb); } if (bb) { bb.n += sl.n; S.inv.splice(invSel, 1); note("Övtáskába tetted: " + I[sl.id].name + "."); } }
      if (d.use === "stash") { S.bank[sl.id] = (S.bank[sl.id] || 0) + sl.n; S.inv.splice(invSel, 1); note("Ládába tetted: " + I[sl.id].name + "."); }
      if (d.use === "drop") { S.inv.splice(invSel, 1); note("Eldobtad: " + I[sl.id].name + "."); }
      invSel = -1; save(); draw(); return;
    }
    if (d.unequip) { if (!SIM.unequip(S, d.unequip)) note("Tele a hátizsák.", "bad"); save(); draw(); return; }
    if (d.craft) {
      var r = SIM.RECIPES.find(function (x) { return x.id === d.craft; });
      if (S.loc !== "falu" || SIM.recipeCheck(S, r) || !SIM.canAdd(S, r.out)) { note(SIM.recipeCheck(S, r) || "Tele a hátizsák.", "bad"); draw(); return; }
      var res = SIM.craft(S, r, rnd);
      note(res.burnt ? "Odaégett. Égett étel lett belőle." : "Elkészült: " + I[res.out].name + ".", res.burnt ? "bad" : "good");
      levelUps(res.ups); save(); draw(); return;
    }
    if (C) {
      if (d.card) { C.sel = C.sel === d.card ? null : d.card; C.rot = 0; C.pv = null; draw(); return; }
      if (d.cell) return tapCell(d.cell);
      if (d.cmd === "end") return endRound();
      if (d.cmd === "flee") return flee();
      if (d.cmd === "quick") return quickFight();
      if (d.cmd === "rot") { var ca = C.sel && cardById(C.sel); if (ca && ca.bleed) C.dir = (C.dir + 1) % 8; else C.rot = (C.rot + 1) % 4; draw(); return; }
    }
    if (d.reset) { overlay('<h2>Új játék?</h2><p>Minden elvész: tudások, holmi, arany. Biztos?</p><div class="btns two">' + btn('data-ov="reset"', "i-skull", "Igen, előről", "", "") + btn('data-ov="close"', "i-run", "Mégse", "", "", { prim: true }) + "</div>"); return; }
  });

  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if ((ev.key === "Enter" || ev.key === " ") && t && t.getAttribute && t.getAttribute("role") === "button" && t.tagName.toLowerCase() === "g") { ev.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  });
  document.addEventListener("toggle", function (ev) {
    if (ev.target && ev.target.id === "logd") { logOpen = ev.target.open; var tg = ev.target.querySelector(".tg"); if (tg) tg.textContent = logOpen ? "kevesebb" : "napló"; }
  }, true);

  var resizeT = 0;
  window.addEventListener("resize", function () { clearTimeout(resizeT); resizeT = setTimeout(function () { if (S && (C || tab === "terkep")) draw(); }, 150); });

  // ---------- Loop ----------
  var last = performance.now(), regenAcc = 0, sceneAcc = 0;
  function tick(now) {
    var dt = Math.min(1, (now - last) / 1000); last = now;
    if (S && !document.hidden) {
      S.played += dt;
      gatherTick(now);
      if (!C && S.dead.length) { regenAcc += dt; if (regenAcc >= 4) { regenAcc = 0; SIM.healCells(S, 1); drawTop(); } }
      sceneAcc += dt; if (sceneAcc >= 1) { sceneAcc = 0; if (!C) drawScene(); }
    }
    requestAnimationFrame(tick);
  }

  S = load();
  if (S) { S.hp = SIM.maxHp(S) - S.dead.length; draw(); } else { S = null; drawTabs(); intro(0); }
  setInterval(function () { if (S) save(); }, 10000);
  requestAnimationFrame(tick);
})();
</script>

</body></html>
