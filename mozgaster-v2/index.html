<title>Mozgástér</title>

<meta name="description" content="Döntéses történelmi játék: egy névtelen tanácsadó javaslatai a magyar pártvezetésnek, 1963-1989, amit a vezetés valójában lépett, két kitalált újság és egy kitalált család a háttérben.">

<style>
/* Layout: an archive file on a grey desk. Sticky file tab with four gauges on top, one typed sheet per case in a single column,
   the main action in a bar at the bottom. Typed (monospace) text = the game's file; printed serif card = what really happened. */
:root {
  --desk: #b4b3a8; --folder: #d8ceb3; --folder-edge: #b6aa8b; --paper: #f4f0e3; --card: #fbf9f2;
  --ink: #25262a; --muted: #625d51; --rule: #cdc3aa; --stamp: #a2322a; --violet: #4a428c; --ok: #3b6a48; --shade: rgba(40, 36, 28, 0.16);
  --news: #efe9d6; --lamp: #e2b64a; --radio: #23242a; --radio-ink: #ece6d3;
  --font-type: "Courier Prime", "Courier New", Courier, monospace;
  --font-print: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-stamp: "Special Elite", "Courier Prime", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #1c1d1b; --folder: #3a362d; --folder-edge: #575040; --paper: #2a2823; --card: #322f29;
  --ink: #ebe5d5; --muted: #b3ab94; --rule: #4d4739; --stamp: #e46a5c; --violet: #aaa2f2; --ok: #8fc79d; --shade: rgba(0, 0, 0, 0.35);
  --news: #36332c; --lamp: #c99a2e; --radio: #121311; --radio-ink: #e4ddc8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #1c1d1b; --folder: #3a362d; --folder-edge: #575040; --paper: #2a2823; --card: #322f29;
  --ink: #ebe5d5; --muted: #b3ab94; --rule: #4d4739; --stamp: #e46a5c; --violet: #aaa2f2; --ok: #8fc79d; --shade: rgba(0, 0, 0, 0.35);
  --news: #36332c; --lamp: #c99a2e; --radio: #121311; --radio-ink: #e4ddc8; color-scheme: dark; }

html, body { overflow-x: clip; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-print); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--folder); }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
p { margin: 0; }
a { color: var(--violet); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

/* File tab with gauges */
.tab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--folder); border: 1px solid var(--folder-edge); border-top: 0;
  border-radius: 0 0 6px 6px; padding: 8px 12px 10px; display: grid; gap: 8px; box-shadow: 0 3px 10px var(--shade); }
.tab .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; }
.brand { font-family: var(--font-stamp); font-size: 1.25rem; letter-spacing: 0.08em; }
.case { font-family: var(--font-type); font-size: 0.85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.g { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; font-family: var(--font-type); font-size: 0.8rem; min-width: 0; }
.g .l { text-transform: uppercase; letter-spacing: 0.06em; }
.g .v { font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: right; }
.g .dv { font-weight: 700; }
.g .dv.up { color: var(--ok); } .g .dv.down { color: var(--stamp); }
.bar { position: relative; height: 9px; border: 1px solid var(--ink); background: var(--paper); min-width: 40px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width 0.5s ease; }
.bar.warn i { background: var(--stamp); }
.bar::before, .bar::after { content: ""; position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.bar::before { left: 25%; } .bar::after { left: 75%; }

/* Sheet */
.sheet { position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; box-shadow: 0 1px 0 var(--folder-edge), 0 8px 18px var(--shade);
  padding: 20px 18px 22px; display: grid; gap: 14px; min-width: 0; }
.head { font-family: var(--font-type); font-size: 0.85rem; color: var(--muted); border-bottom: 1px dashed var(--rule); padding-bottom: 8px; display: grid; gap: 2px; padding-right: 92px; }
.head b { color: var(--ink); font-weight: 700; }
.corner { position: absolute; top: 14px; right: 12px; font-family: var(--font-stamp); font-size: 0.75rem; color: var(--stamp); border: 2px solid var(--stamp);
  padding: 2px 6px; transform: rotate(4deg); letter-spacing: 0.08em; opacity: 0.85; }
.year { font-family: var(--font-type); font-weight: 700; font-size: 2.1rem; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-type); font-weight: 700; font-size: 1.35rem; line-height: 1.25; }
h2 { font-family: var(--font-type); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.06em; }
.typed { font-family: var(--font-type); font-size: 1rem; line-height: 1.6; display: grid; gap: 10px; }
.ask { font-family: var(--font-type); font-weight: 700; font-size: 1.05rem; border-top: 1px dashed var(--rule); padding-top: 12px; }

/* Proposals */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: start; text-align: left; background: var(--card); border: 2px solid var(--ink);
  border-radius: 3px; padding: 14px 14px 14px 10px; cursor: pointer; min-height: 56px; box-shadow: 3px 3px 0 var(--folder-edge); }
.opt:hover { background: var(--folder); }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--folder-edge); }
.opt .key { font-family: var(--font-type); font-weight: 700; font-size: 1.2rem; text-align: center; }
.opt .s { font-family: var(--font-type); font-weight: 700; display: block; }
.opt .t { display: block; font-size: 0.95rem; color: var(--muted); margin-top: 2px; }

/* Outcome */
.mine { font-family: var(--font-type); border-left: 3px solid var(--ink); padding-left: 10px; display: grid; gap: 4px; }
.mine .lab { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-type); font-size: 0.85rem; }
.chip { border: 1px solid var(--rule); padding: 1px 7px; border-radius: 2px; font-variant-numeric: tabular-nums; }
.chip.up { color: var(--ok); border-color: currentColor; } .chip.down { color: var(--stamp); border-color: currentColor; }
.press { font-family: var(--font-type); font-size: 0.88rem; color: var(--muted); font-style: italic; }
.stamp { justify-self: start; font-family: var(--font-stamp); font-size: 1.5rem; letter-spacing: 0.12em; padding: 4px 14px; border: 3px solid currentColor;
  border-radius: 4px; transform: rotate(-3deg); animation: press 0.45s ease-out both; }
.stamp.s2 { color: var(--ok); } .stamp.s1 { color: var(--violet); } .stamp.s0 { color: var(--stamp); }
@keyframes press { from { transform: rotate(-3deg) scale(1.6); opacity: 0; } 60% { transform: rotate(-3deg) scale(0.96); opacity: 1; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
.real { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 16px; display: grid; gap: 10px; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.55em - 1px), var(--rule) calc(1.55em - 1px), var(--rule) 1.55em); background-position: 0 2.6em; background-size: 100% 1.55em; background-repeat: repeat-y; }
.real h3 { font-family: var(--font-type); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.real .rs { font-weight: 600; }
.src { font-family: var(--font-type); font-size: 0.8rem; color: var(--muted); display: grid; gap: 2px; }
.warn { border: 2px dashed var(--stamp); padding: 12px 14px; display: grid; gap: 6px; background: var(--paper); }
.warn h3 { font-family: var(--font-type); color: var(--stamp); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* Summary */
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score { border: 1px solid var(--rule); background: var(--card); padding: 10px 12px; display: grid; gap: 2px; }
.score .n { font-family: var(--font-type); font-weight: 700; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score .l { font-family: var(--font-type); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-left: 2px solid var(--ink); }
.tl li { position: relative; padding: 0 0 14px 16px; display: grid; gap: 3px; min-width: 0; }
.tl li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 50%; }
.tl .y { font-family: var(--font-type); font-weight: 700; font-variant-numeric: tabular-nums; }
.tl .pair { display: grid; grid-template-columns: 6.2em 1fr; gap: 2px 8px; font-size: 0.93rem; }
.tl .pair span:nth-child(odd) { font-family: var(--font-type); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding-top: 2px; }
.mini { font-family: var(--font-stamp); font-size: 0.8rem; letter-spacing: 0.08em; border: 2px solid currentColor; padding: 0 5px; justify-self: start; }
.mini.s2 { color: var(--ok); } .mini.s1 { color: var(--violet); } .mini.s0 { color: var(--stamp); }
.links { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.links a { font-family: var(--font-type); font-weight: 700; display: inline-block; padding: 6px 0; }
.epi { display: grid; gap: 8px; }
.epi div { display: grid; grid-template-columns: 7.6em 1fr; gap: 8px; font-size: 0.95rem; }
.epi b { font-family: var(--font-type); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 6px; font-size: 0.95rem; }
.legend div { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; }
.legend b { font-family: var(--font-type); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
.fine { font-size: 0.85rem; color: var(--muted); }
.reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-family: var(--font-type); font-size: 0.85rem; }
.link { background: none; border: 0; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--muted); }
.link.danger { color: var(--stamp); }

/* Bottom action bar */
.act { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--folder); border-top: 1px solid var(--folder-edge);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.act .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.act .hint { font-family: var(--font-type); font-size: 0.9rem; color: var(--muted); flex: 1; }
.prim { flex: 1; min-height: 52px; background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; font-family: var(--font-type); font-weight: 700;
  font-size: 1.05rem; letter-spacing: 0.04em; cursor: pointer; padding: 10px 16px; }
.prim:active { transform: translateY(1px); }

/* Menu button in the tab, start menu */
.tabr { display: flex; gap: 8px; align-items: center; min-width: 0; }
.menub { font-family: var(--font-type); font-weight: 700; font-size: 0.85rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 3px;
  padding: 4px 10px; min-height: 36px; cursor: pointer; box-shadow: 2px 2px 0 var(--folder-edge); }
.menub:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--folder-edge); }
.mlist { display: grid; gap: 10px; }
.mi { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; background: var(--card); border: 2px solid var(--ink); border-radius: 3px;
  padding: 12px 14px; cursor: pointer; box-shadow: 3px 3px 0 var(--folder-edge); min-height: 56px; }
.mi:hover { background: var(--folder); }
.mi:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--folder-edge); }
.mi.main { border-width: 3px; }
.mi-t { font-family: var(--font-type); font-weight: 700; font-size: 1.05rem; }
.mi-d { grid-column: 1; font-size: 0.92rem; color: var(--muted); }
.mi-n { grid-row: 1 / 3; grid-column: 2; align-self: center; font-family: var(--font-type); font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.confirm { border: 2px dashed var(--stamp); padding: 10px 12px; display: grid; gap: 8px; font-family: var(--font-type); font-size: 0.92rem; }
.confirm .row2 { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.btn2 { font-family: var(--font-type); font-weight: 700; background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
.endnav { display: flex; flex-wrap: wrap; gap: 8px; }
.endnav .menub { min-height: 44px; }

/* Interlude: two newspapers */
.papers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.np { background: var(--news); border: 1px solid var(--rule); box-shadow: 0 2px 6px var(--shade); padding: 12px; display: grid; gap: 7px; min-width: 0; transform: rotate(-0.4deg); }
.np-mast { font-family: var(--font-print); font-weight: 600; font-size: 1.45rem; letter-spacing: 0.08em; text-align: center; line-height: 1.1;
  border-bottom: 3px double var(--ink); padding-bottom: 5px; }
.np-sub { font-family: var(--font-type); font-size: 0.7rem; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
.np-h { font-family: var(--font-print); font-weight: 600; font-size: 1.22rem; line-height: 1.2; text-wrap: balance; }
.np-l { font-size: 0.93rem; line-height: 1.5; }
.radio { background: var(--radio); color: var(--radio-ink); border-radius: 3px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.radio .band { display: flex; gap: 8px; align-items: center; font-family: var(--font-stamp); font-size: 0.85rem; letter-spacing: 0.1em; }
.radio .band svg { flex: none; }
.radio p { font-family: var(--font-type); font-size: 0.92rem; line-height: 1.55; }
.radio .coda { border-top: 1px dashed currentColor; padding-top: 8px; font-style: italic; }
.radio .note { font-size: 0.78rem; opacity: 0.8; }
.gap { border-left: 3px solid var(--violet); padding-left: 10px; display: grid; gap: 4px; }
.gap h3, .fam h3, .newc h3 { font-family: var(--font-type); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Interlude: the Kovács family */
.fam { background: var(--card); border: 1px solid var(--rule); padding: 12px; display: grid; gap: 8px; min-width: 0; }
.fam svg { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
.fam .vl { font-style: italic; }
.sv-sky { fill: var(--paper); }
.sv-l { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sv-t { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; }
.sv-f { fill: var(--folder); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.sv-w { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
.sv-lamp { fill: var(--lamp); stroke: var(--ink); stroke-width: 1.5; }
.sv-red { fill: var(--stamp); } .sv-grn { fill: var(--ok); } .sv-ink { fill: var(--ink); }
.sv-rain { stroke: var(--violet); stroke-width: 1.5; stroke-linecap: round; }
.sv-txt { fill: var(--ink); font-family: var(--font-type); font-size: 8px; font-weight: 700; }
.newc { display: grid; gap: 6px; }

/* Vitrin, archive, album, quiz */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.vc { background: var(--card); border: 1px solid var(--rule); border-top: 4px solid var(--violet); padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.vc h3 { font-family: var(--font-type); font-size: 1rem; line-height: 1.3; }
.vc p { font-size: 0.93rem; }
.vc .o { font-family: var(--font-type); font-size: 0.78rem; color: var(--muted); }
.vc.locked { background: transparent; border-style: dashed; border-top: 4px dashed var(--rule); color: var(--muted); }
.arch { display: grid; gap: 18px; }
.arch > section { display: grid; gap: 10px; border-top: 1px dashed var(--rule); padding-top: 12px; }
.arch .y { font-family: var(--font-type); font-weight: 700; font-variant-numeric: tabular-nums; }
.qn { font-family: var(--font-type); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.qdef { font-size: 1.02rem; background: var(--card); border: 1px solid var(--rule); padding: 12px; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); box-shadow: 3px 3px 0 var(--ok); }
.opt.wrong { border-color: var(--stamp); box-shadow: 3px 3px 0 var(--stamp); }
.opt.one { grid-template-columns: 1fr; padding-left: 14px; }
.fb { display: grid; gap: 6px; border-left: 3px solid var(--ok); padding-left: 10px; }
.fb.bad { border-left-color: var(--stamp); }
.fb b { font-family: var(--font-type); }
@media (max-width: 560px) { .papers { grid-template-columns: 1fr; } .np { transform: none; } }

@media (max-width: 420px) {
  .gauges { gap: 5px 10px; }
  .g { grid-template-columns: auto minmax(24px, 1fr) auto; gap: 4px; font-size: 0.72rem; }
  .g .l { letter-spacing: 0.02em; }
  .g .v { min-width: 3.9em; }
  .year { font-size: 1.8rem; }
  .sheet { padding: 16px 14px 18px; }
  .tl .pair { grid-template-columns: 1fr; }
  .epi div, .legend div { grid-template-columns: 1fr; gap: 0; }
  .brand { font-size: 1.1rem; }
  .tab .case { font-size: 0.78rem; }
}
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } .bar i { transition: none; } }
</style>

<script>
// Mozgástér: pure game logic and content (no DOM). Every historical statement in the "real"/"why"/"sit" fields, the
// newspapers, the family vignettes and the vitrin cards comes from the course slides (A jelenkori magyar történelem
// alapjai II., tételek 7, 9, 10). The advisor, the Kovács family, the Népi Hírlap and the radio wording are invented.
var SIM = (function () {
  "use strict";

  var METERS = [
    { k: "M", name: "Moszkva bizalma", short: "Moszkva" },
    { k: "N", name: "Lakossági nyugalom", short: "Nyugalom" },
    { k: "G", name: "Gazdasági egyensúly", short: "Gazdaság" },
    { k: "R", name: "Reform-lendület", short: "Reform" }
  ];
  var START = { M: 60, N: 55, G: 60, R: 45 };
  var LOW = 25, HIGH = 75, RESET = 15;

    D.forEach(function (d, i) {
      var p = S.picks[i]; if (!p) return;
      h += '<li><span class="y">' + esc(d.year) + " · " + esc(d.title) + '</span><span class="mini s' + p.match + '">' + STAMP[p.match] + '</span><div class="pair"><span>Te</span><span>' +
        esc(d.opts[p.k].s) + "</span><span>Valójában</span><span>" + esc(d.rs) + "</span></div></li>";
    });
    h += "</ol><h2>Utóirat, 1989</h2><div class=\"epi\">";
    SIM.EPILOGUE.forEach(function (e) { h += "<div><b>" + esc(e.date) + "</b><span>" + esc(e.t) + "</span></div>"; });
    h += "</div><h2>A gyűjteményed</h2><p>" + count(A.cards) + " / " + SIM.CARDS.length + " kártya a vitrinben, " + count(A.papers) + " újságpár, " + count(A.album) + " kép Kovácsék albumában.</p>" +
      '<div class="endnav"><button class="menub" type="button" id="end-vitrin" data-act="go" data-to="vitrin">Vitrin</button><button class="menub" type="button" id="end-quiz" data-act="go" data-to="quiz">Ismétlő kvíz</button>' +
      '<button class="menub" type="button" id="end-papers" data-act="go" data-to="papers">Újságarchívum</button><button class="menub" type="button" id="end-album" data-act="go" data-to="album">Kovácsék albuma</button></div>';
    h += "<h2>Tovább a Tudástárba</h2><ul class=\"links\">";
    SIM.LINKS.forEach(function (l) { h += '<li><a href="' + l.href + '" target="_blank" rel="noopener">' + esc(l.label) + "</a></li>"; });
    h += '</ul><p class="fine">Forrás: ' + COURSE + ', 7., 9. és 10. tétel. A tanácsadó és a javaslatai, a Kovács család, a Népi Hírlap és a rádiószövegek kitaláltak, a „valójában” lapok a diasort követik.</p></article>';
    return h;
  }

  function resetRow() {
    return '<div class="reset">' + (confirmReset
      ? '<span>Az eddigi javaslatok törlődnek.</span><button class="link danger" type="button" id="reset-yes" data-act="reset-yes">Igen, új dosszié</button><button class="link" type="button" id="reset-no" data-act="reset-no">Mégsem</button>'
      : '<button class="link" type="button" id="reset-ask" data-act="reset-ask">Új dosszié</button>') + "</div>";
  }

  // ----- Illustrations (inline SVG, colors from the theme tokens) -----
  function waveSvg() {
    return '<svg width="26" height="18" viewBox="0 0 26 18" aria-hidden="true"><rect x="1" y="7" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
      '<circle cx="5.5" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 7 L15 1 M16 6 q3 3 0 6 M19 4 q5 5 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  }
  var PROP_NAME = { garden: "kert", chickens: "tyúkok", pig: "disznó", radio: "rádió", shop: "bolt", coins: "pénz", mine: "bányatorony", suitcase: "bőrönd útlevéllel",
    tools: "szerszámosláda", ballot: "szavazóurna", taxpaper: "fizetési papír", crowd: "tömeg", flag: "zászló" };
  function prop(name, x) {
    var g = "";
    if (name === "garden") { for (var r = 0; r < 3; r++) { g += '<line class="sv-t" x1="' + (x + 2) + '" y1="' + (116 - r * 6) + '" x2="' + (x + 36) + '" y2="' + (116 - r * 6) + '"/>'; for (var c = 0; c < 4; c++) { var cx = x + 5 + c * 9, cy = 116 - r * 6; g += '<path class="sv-t" d="M' + cx + " " + cy + " l-2 -4 M" + cx + " " + cy + ' l2 -4"/>'; } } }
    else if (name === "chickens") { [x + 9, x + 28].forEach(function (cx) { g += '<ellipse class="sv-w" cx="' + cx + '" cy="110" rx="7" ry="5"/><circle class="sv-w" cx="' + (cx + 6) + '" cy="103" r="3"/><path class="sv-red" d="M' + (cx + 9) + " 103 l3 1 l-3 1 z\"/><path class=\"sv-t\" d=\"M" + (cx - 2) + " 115 v3 M" + (cx + 2) + ' 115 v3"/>'; }); }
    else if (name === "pig") { g += '<ellipse class="sv-f" cx="' + (x + 18) + '" cy="106" rx="14" ry="8"/><ellipse class="sv-w" cx="' + (x + 33) + '" cy="105" rx="3" ry="3.5"/><path class="sv-l" d="M' + (x + 10) + " 113 v5 M" + (x + 16) + " 114 v4 M" + (x + 22) + " 114 v4 M" + (x + 27) + " 113 v5 M" + (x + 4) + " 103 q-4 -2 -2 -5\"/><path class=\"sv-f\" d=\"M" + (x + 25) + " 99 l3 -5 l2 6 z\"/>"; }
    else if (name === "radio") { g += '<line class="sv-l" x1="' + (x + 2) + '" y1="112" x2="' + (x + 36) + '" y2="112"/><path class="sv-l" d="M' + (x + 6) + " 112 v6 M" + (x + 32) + ' 112 v6"/><rect class="sv-f" x="' + (x + 5) + '" y="94" width="28" height="18" rx="3"/><circle class="sv-w" cx="' + (x + 13) + '" cy="103" r="5"/><path class="sv-t" d="M' + (x + 22) + " 99 h8 M" + (x + 22) + " 103 h8 M" + (x + 22) + " 107 h8 M" + (x + 29) + " 94 l6 -14\"/>"; }
    else if (name === "shop") { g += '<rect class="sv-w" x="' + (x + 2) + '" y="88" width="34" height="30"/><path class="sv-red" d="M' + x + " 88 h38 l-3 -8 h-32 z\"/><rect class=\"sv-f\" x=\"" + (x + 14) + '" y="102" width="10" height="16"/><text class="sv-txt" x="' + (x + 7) + '" y="98">BOLT</text>'; }
    else if (name === "coins") { [0, 1, 2, 3].forEach(function (k) { g += '<ellipse class="sv-lamp" cx="' + (x + 12) + '" cy="' + (114 - k * 4) + '" rx="8" ry="3"/>'; }); [0, 1].forEach(function (k) { g += '<ellipse class="sv-lamp" cx="' + (x + 29) + '" cy="' + (114 - k * 4) + '" rx="7" ry="3"/>'; }); }
    else if (name === "mine") { g += '<path class="sv-l" d="M' + (x + 4) + " 118 L" + (x + 19) + " 74 L" + (x + 34) + " 118 M" + (x + 9) + " 104 h20 M" + (x + 13) + " 90 h12 M" + (x + 9) + " 104 L" + (x + 25) + " 90 M" + (x + 29) + " 104 L" + (x + 13) + ' 90"/><circle class="sv-w" cx="' + (x + 19) + '" cy="74" r="6"/><line class="sv-t" x1="' + (x + 19) + '" y1="80" x2="' + (x + 19) + '" y2="118"/>'; }
    else if (name === "suitcase") { g += '<rect class="sv-f" x="' + (x + 4) + '" y="98" width="30" height="20" rx="2"/><path class="sv-l" d="M' + (x + 14) + " 98 v-4 h10 v4 M" + (x + 12) + " 98 v20 M" + (x + 26) + ' 98 v20"/><rect class="sv-red" x="' + (x + 28) + '" y="88" width="9" height="12" rx="1"/>'; }
    else if (name === "tools") { g += '<rect class="sv-red" x="' + (x + 4) + '" y="104" width="30" height="14" rx="1"/><path class="sv-l" d="M' + (x + 12) + " 104 v-5 h14 v5 M" + (x + 8) + " 96 L" + (x + 22) + ' 82"/><circle class="sv-w" cx="' + (x + 24) + '" cy="80" r="3.5"/>'; }
    else if (name === "ballot") { g += '<rect class="sv-f" x="' + (x + 6) + '" y="96" width="26" height="22"/><line class="sv-l" x1="' + (x + 13) + '" y1="96" x2="' + (x + 25) + '" y2="96"/><rect class="sv-w" x="' + (x + 13) + '" y="82" width="12" height="13"/><path class="sv-t" d="M' + (x + 16) + " 85 l6 7 M" + (x + 22) + " 85 l-6 7\"/>"; }
    else if (name === "taxpaper") { g += '<rect class="sv-w" x="' + (x + 6) + '" y="80" width="26" height="36"/>'; for (var l = 0; l < 4; l++) g += '<line class="sv-t" x1="' + (x + 10) + '" y1="' + (88 + l * 5) + '" x2="' + (x + 28) + '" y2="' + (88 + l * 5) + '"/>'; g += '<text class="sv-txt" x="' + (x + 19) + '" y="114">%</text>'; }
    else if (name === "crowd") { for (var p = 0; p < 5; p++) { var px = x + 3 + p * 8, py = p % 2 ? 98 : 101; g += '<circle class="sv-w" cx="' + px + '" cy="' + py + '" r="3.5"/><path class="sv-f" d="M' + (px - 4) + " 118 v-10 q4 -5 8 0 v10 z\"/>"; } }
    else if (name === "flag") { g += '<line class="sv-l" x1="' + (x + 8) + '" y1="118" x2="' + (x + 8) + '" y2="70"/><rect class="sv-red" x="' + (x + 9) + '" y="72" width="26" height="7"/><rect class="sv-w" x="' + (x + 9) + '" y="79" width="26" height="7"/><rect class="sv-grn" x="' + (x + 9) + '" y="86" width="26" height="7"/>'; }
    return g;
  }
  // Village house left, city factory right, up to three props between; weather follows "Nyugalom", the lit window "Gazdaság".
  function famSvg(props, m, era) {
    var n = m.N, lit = m.G >= 50;
    var desc = "Kovácsék, " + era + ": falusi ház, városi gyár" + (props.length ? ", " + props.map(function (p) { return PROP_NAME[p]; }).join(", ") : "") +
      (n >= 55 ? ", napsütés" : n >= 40 ? ", felhős ég" : ", eső");
    var g = '<svg viewBox="0 0 320 140" role="img" aria-label="' + esc(desc) + '"><rect class="sv-sky" x="0" y="0" width="320" height="140"/>';
    if (n >= 55) {
      g += '<circle class="sv-lamp" cx="200" cy="26" r="10"/>';
      for (var a = 0; a < 8; a++) { var ang = a * Math.PI / 4; g += '<line class="sv-t" x1="' + (200 + Math.cos(ang) * 14).toFixed(1) + '" y1="' + (26 + Math.sin(ang) * 14).toFixed(1) + '" x2="' + (200 + Math.cos(ang) * 19).toFixed(1) + '" y2="' + (26 + Math.sin(ang) * 19).toFixed(1) + '"/>'; }
    } else {
      g += '<path class="sv-w" d="M176 36 q-10 0 -8 -9 q2 -8 11 -6 q4 -9 15 -6 q9 -6 16 3 q10 0 9 9 q-1 9 -10 9 z"/>';
      if (n < 40) for (var r = 0; r < 6; r++) g += '<line class="sv-rain" x1="' + (178 + r * 7) + '" y1="44" x2="' + (174 + r * 7) + '" y2="54"/>';
    }
    g += '<line class="sv-l" x1="0" y1="118" x2="320" y2="118"/>';
    // house
    g += '<rect class="sv-f" x="20" y="74" width="70" height="44"/><path class="sv-w" d="M14 76 L55 46 L96 76 Z"/><rect class="sv-f" x="74" y="52" width="8" height="14"/>' +
      '<rect class="sv-f" x="49" y="92" width="14" height="26"/><rect class="' + (lit ? "sv-lamp" : "sv-w") + '" x="27" y="84" width="14" height="12"/><path class="sv-t" d="M34 84 v12 M27 90 h14"/>';
    // factory
    g += '<rect class="sv-f" x="240" y="80" width="72" height="38"/><path class="sv-w" d="M240 80 l12 -12 v12 l12 -12 v12 l12 -12 v12 l12 -12 v12 z"/><rect class="sv-f" x="296" y="40" width="10" height="40"/>' +
      '<circle class="sv-w" cx="303" cy="32" r="5"/><circle class="sv-w" cx="296" cy="22" r="6"/><circle class="sv-w" cx="286" cy="13" r="5"/>';
    for (var w = 0; w < 4; w++) g += '<rect class="' + (lit ? "sv-lamp" : "sv-w") + '" x="' + (246 + w * 16) + '" y="92" width="9" height="9"/>';
    props.slice(0, 3).forEach(function (pn, k) { g += prop(pn, 106 + k * 44); });
    return g + "</svg>";
  }

  // ----- Action bar -----
  function renderAct() {
    var h = '<div class="in">';
    if (scr === "menu") {
      h += inProgress() ? '<button class="prim" type="button" id="act-continue" data-act="continue">Folytatás</button>' : '<button class="prim" type="button" id="act-new" data-act="newgame">Új játék</button>';
    } else if (scr === "quiz") {
      if (Q && Q.i < Q.qs.length && Q.pick === null) h += '<span class="hint">Válassz egy fogalmat.</span><button class="link" type="button" id="act-menu" data-act="go" data-to="menu">Főmenü</button>';
      else if (Q && Q.i < Q.qs.length) h += '<button class="prim" type="button" id="act-qnext" data-act="qnext">' + (Q.i + 1 < Q.qs.length ? "Következő kérdés" : "Eredmény") + "</button>";
      else if (Q) h += '<button class="prim" type="button" id="act-qnew" data-act="qnew">Új kvíz</button><button class="link" type="button" id="act-menu" data-act="go" data-to="menu">Főmenü</button>';
      else h += backButtons();
    } else if (scr !== "game") {
      h += backButtons();
    } else if (S.phase === "intro") h += '<button class="prim" type="button" id="act-begin" data-act="begin">Dosszié megnyitása</button>';
    else if (S.phase === "q") h += '<span class="hint">Válassz egy javaslatot (A, B' + (D[S.i].opts.length > 2 ? " vagy C" : "") + ").</span>";
    else if (S.phase === "real") h += '<button class="prim" type="button" id="act-news" data-act="news">Másnap: újságok, Kovácsék</button>';
    else if (S.phase === "news") h += '<button class="prim" type="button" id="act-next" data-act="next">' + (S.i + 1 < D.length ? "Következő ügy: " + esc(D[S.i + 1].year) : "Összesítő jelentés") + "</button>";
    else h += confirmReset
      ? '<button class="prim" type="button" id="act-reset-yes" data-act="reset-yes">Igen, kezdjük újra</button><button class="link" type="button" id="act-reset-no" data-act="reset-no">Mégsem</button>'
      : '<button class="prim" type="button" id="act-reset" data-act="reset-ask">Új dosszié</button>';
    $("act").innerHTML = h + "</div>";
  }
  function backButtons() {
    return inProgress() && S.phase !== "end"
      ? '<button class="prim" type="button" id="act-continue" data-act="continue">Vissza a játékhoz</button><button class="link" type="button" id="act-menu" data-act="go" data-to="menu">Főmenü</button>'
      : '<button class="prim" type="button" id="act-menu" data-act="go" data-to="menu">Főmenü</button>';
  }

  function render(top) {
    if (scr === "game" && S.phase === "end" && SIM.archiveEnd(A).length) saveArch();
    renderTab();
    var v = { menu: viewMenu, vitrin: viewVitrin, papers: viewPapers, album: viewAlbum, quiz: viewQuiz, sources: viewSources }[scr];
    $("view").innerHTML = v ? v() : S.phase === "intro" ? viewIntro() : S.phase === "q" ? viewQ() : S.phase === "real" ? viewReal() : S.phase === "news" ? viewNews() : viewEnd();
    renderAct();
    if (top) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!b) return;
    var a = b.dataset.act, top = true;
    if (a === "go") { scr = b.dataset.to; confirmNew = false; if (scr === "quiz" && (!Q || Q.i >= Q.qs.length)) newQuiz(); }
    else if (a === "continue") { scr = "game"; }
    else if (a === "newgame") { if (inProgress()) { confirmNew = true; top = false; } else { S = SIM.start(); scr = "game"; } }
    else if (a === "newgame-yes") { confirmNew = false; S = SIM.start(); scr = "game"; }
    else if (a === "newgame-no") { confirmNew = false; top = false; }
    else if (a === "qa") { if (Q && Q.pick === null) { Q.pick = +b.dataset.k; if (Q.pick === Q.qs[Q.i].ans) Q.right++; } top = false; }
    else if (a === "qnext") { if (Q) { Q.i++; Q.pick = null; } }
    else if (a === "qnew") { newQuiz(); }
    else if (a === "begin") SIM.begin(S);
    else if (a === "pick") { var r = SIM.choose(S, +b.dataset.k); if (r) { SIM.archiveDecision(A, S.i, r.k, S.m); saveArch(); } }
    else if (a === "news") SIM.toNews(S);
    else if (a === "next") SIM.next(S);
    else if (a === "reset-ask") { confirmReset = true; top = false; }
    else if (a === "reset-no") { confirmReset = false; top = false; }
    else if (a === "reset-yes") { confirmReset = false; S = SIM.start(); }
    else return;
    if (a !== "reset-ask" && a !== "reset-no") confirmReset = false;
    save(); render(top);
  });

  function start(data) {
    S = data && valid(data.S) ? data.S : (load() || SIM.start());
    A = loadArch();
    scr = data && data.scr === "game" ? "game" : "menu";
    render(false);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { S: S, scr: scr }; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>

</body></html>
